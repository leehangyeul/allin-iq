<head>

<style>
/* Pretendard (SIL OFL 1.1) — ../fonts/Pretendard-LICENSE.txt */
@font-face{font-family:"Pretendard";font-weight:400;font-display:swap;src:url("../fonts/Pretendard-Regular.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:600;font-display:swap;src:url("../fonts/Pretendard-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:700;font-display:swap;src:url("../fonts/Pretendard-Bold.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:800;font-display:swap;src:url("../fonts/Pretendard-ExtraBold.woff2") format("woff2")}
:root{color-scheme:dark;
  --bg:#07090F;--surface:#0D1018;--surface-2:#0A0D14;--line:#1A1F2B;--line-2:#2A2F3B;--fg:#F8F9FB;--muted:#A39C8E;--soft:#C9C3B8;
  --gold:#D4AF7C;--gold-2:#F0D7AE;--gold-3:#EAD3AE;--gold-dk:#231D13;
  --felt:#11161F;--felt-2:#0A0D14;--rim:#8A6B3F;
  --good:#7FD4A0;--ok:#E3B65C;--bad:#F08A80;--allin:#C2474F;
  --sans:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 12%,#17161B 0%,#07090F 60%) fixed,#07090F;color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;letter-spacing:-.01em;
  padding:10px max(14px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.solo-home{display:none;align-self:flex-start;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);color:var(--gold-3);font-size:14px;font-weight:700;text-decoration:none;align-items:center}
.solo .solo-home{display:inline-flex}
/* header */
.hd{display:flex;align-items:center;gap:10px}
.hd .t{flex:1;min-width:0}
.hd h1{margin:0;font-size:19px;font-weight:800}
.hd small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--gold-3);font-size:14px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:7px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.chip span{font-size:11px;color:var(--muted);white-space:nowrap}
.chip b{font-family:var(--mono);font-size:14px;white-space:nowrap}
.chip.me{border-color:rgba(212,175,124,.55);background:#1C170F}.chip.me b{color:var(--gold-2)}
/* table */
.table{position:relative;width:100%;aspect-ratio:3/3.3;max-height:62vh;margin:30px auto 6px}
.rim{position:absolute;inset:5% 5% 7%;border-radius:46%/40%;background:linear-gradient(160deg,#2B2519,#121010);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.felt{position:absolute;inset:8% 8% 10%;border-radius:44%/38%;background:radial-gradient(110% 80% at 50% 38%,#1A2130,#0A0D14);border:1.5px solid rgba(212,175,124,.55)}
.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:68%}
.potlbl{font-size:11px;color:var(--muted);letter-spacing:.06em}
.pot{font:700 22px var(--mono);color:var(--gold-2)}
.boardrow{display:flex;gap:4px;justify-content:center}
.slot{width:clamp(30px,9vw,44px);aspect-ratio:5/7;border-radius:6px;border:1.5px dashed rgba(212,175,124,.25)}
.card{width:clamp(30px,9vw,44px);aspect-ratio:5/7;border-radius:6px;background:#FBF6EC;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:3px 4px;
  font-family:var(--mono);font-weight:700;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.35);font-size:clamp(13px,4vw,18px)}
.card i{font-style:normal;font-size:.9em;align-self:center}
.card.s,.card.c{color:#15171C}.card.h,.card.d{color:#C2343F}
.card.back{background:repeating-linear-gradient(45deg,#2B2519 0 4px,#3A3122 4px 8px);border:1.5px solid var(--gold)}
.card.big{width:clamp(48px,14vw,62px);font-size:clamp(22px,6.4vw,30px);padding:4px 6px}
@media (prefers-reduced-motion:no-preference){.card.deal{animation:deal .22s ease-out}@keyframes deal{from{transform:translateY(-8px) scale(.92);opacity:.3}}}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2}
.seat .box{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:3px 8px;text-align:center;min-width:58px}
.seat .pos{font-size:11px;font-weight:800}
.seat .stk{font:700 11px var(--mono);color:var(--soft)}
.seat .sty{font-size:9px;color:var(--muted)}
.seat.folded{opacity:.42}
.seat.inhand .box{border-color:rgba(212,175,124,.75);background:#1C170F}
.seat.acting .box{box-shadow:0 0 0 2px var(--gold)}
.seat .cards{display:flex;gap:2px}
.seat .cards .card{width:24px;font-size:11px;padding:2px}
.seat .act{font-size:10px;font-weight:700;background:rgba(0,0,0,.7);color:#fff;border-radius:6px;padding:1px 6px;white-space:nowrap}
.seat .tag{font-size:9px;font-weight:800;padding:0 5px;border-radius:4px;background:var(--gold);color:#0B0A08}
.btnmark{position:absolute;width:20px;height:20px;border-radius:50%;background:#F5F1E6;color:#222;font:700 10px var(--mono);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);z-index:3}
.bet{position:absolute;transform:translate(-50%,-50%);font:700 11px var(--mono);color:var(--gold-2);background:rgba(0,0,0,.5);border-radius:999px;padding:1px 7px;z-index:2;white-space:nowrap}
.herohand{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);display:flex;gap:6px;z-index:4}
.herobar{position:absolute;left:50%;top:95%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid rgba(212,175,124,.6);background:#0D1018;z-index:4;white-space:nowrap}
.herobar span{font-size:12px;font-weight:800;color:#0B0A08;background:var(--gold);border-radius:999px;padding:2px 9px}
.herobar b{font:700 17px var(--mono)}
/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;min-width:0}
.tile span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font:700 15px var(--mono);white-space:nowrap}
.tile.hl{border-color:rgba(212,175,124,.55);background:#1C170F}.tile.hl b{color:var(--gold-2)}
.status{font-size:15px;font-weight:700;min-height:22px}
.status em{font-style:normal;color:var(--bad)}
.solve{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.solve .bar{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.solve .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.actions{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.actions button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:14px;min-height:56px;padding:8px;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.actions button small{font:600 11px var(--mono);color:var(--muted)}
.actions button.k-bet,.actions button.k-raise{border:0;background:linear-gradient(160deg,#F0D7AE,#C79E66 55%,#A9824E);color:#0B0A08}
.actions button.k-bet small,.actions button.k-raise small{color:#3A2B14}
.actions button.k-allin{border-color:rgba(194,71,79,.8);background:#2A1215;color:#FFD9D6}
.actions button.k-fold{color:var(--soft)}
.sizer{border:1px solid var(--line-2);border-radius:16px;background:var(--surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.szrow{display:flex;align-items:center;gap:8px}
.szl{flex:none;font-size:13px;color:var(--soft);font-weight:700}
.szb{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:20px;font-weight:700;color:var(--gold-3)}
.szv{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:4px;height:44px;border-radius:12px;border:1px solid rgba(212,175,124,.6);background:#0D1018;padding:0 8px}
.szv input{width:100%;min-width:0;border:0;background:none;color:var(--gold-2);font:700 22px var(--mono);text-align:right;padding:6px 0;-webkit-user-select:text;user-select:text;-moz-appearance:textfield}
.szv input::-webkit-outer-spin-button,.szv input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.szv input:focus{outline:none}.szv:focus-within{box-shadow:0 0 0 2px var(--gold)}
.szv span{font:700 13px var(--mono);color:var(--muted)}
.sizer input[type=range]{width:100%;accent-color:#D4AF7C;height:28px}
.szlb{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted)}
.szps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.szps button{min-height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--soft);font-size:13px;font-weight:700;padding:0}
.waiting{color:var(--muted);font-size:14px;text-align:center;padding:6px 0}
.note{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;margin:0}
.primary{border:0;background:linear-gradient(160deg,#F0D7AE,#C79E66 55%,#A9824E);color:#0B0A08;border-radius:16px;min-height:52px;font-weight:900;font-size:16px;width:100%}
.ghost{border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);border-radius:16px;min-height:52px;font-weight:800;font-size:15px;width:100%}
.logbox summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);padding:2px 0}
.log{max-height:160px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:2px;margin-top:6px}
.log div{display:flex;gap:6px}
.log .p{font:700 11px var(--mono);color:var(--muted);min-width:46px}
.log .h{font-weight:700;color:var(--gold-2)}
.log .t{color:var(--muted);font-size:12px;margin-top:4px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet .body{background:#0B0E15;border:1px solid var(--line-2);border-bottom:0;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .body>*{flex-shrink:0}
.sheet h2{margin:0;font-size:19px;font-weight:800}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.closebtn{border:0;background:none;color:var(--soft);min-height:40px;padding:0 6px;font-weight:700;font-size:14px}
.meta{font-size:12px;color:var(--muted)}
.res{border:1px solid rgba(212,175,124,.55);border-radius:18px;background:#0D1018;padding:14px;display:flex;flex-direction:column;gap:10px}
.res .net{font:700 30px var(--mono)}
.res .net.pos{color:var(--good)}.res .net.neg{color:var(--bad)}
.res .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--gold-dk);color:var(--gold-2);border:1px solid rgba(212,175,124,.4)}
.vs{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.vs .who{font-size:12px;color:var(--muted);margin-bottom:3px}
.vs .cards{display:flex;gap:3px}
.vs .card{width:30px;font-size:13px}
.dec{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.dec .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dec .st{font-weight:800;font-size:16px}
.grade{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.grade.good{background:rgba(127,212,160,.16);color:var(--good)}.grade.ok{background:rgba(227,182,92,.16);color:var(--ok)}.grade.bad{background:rgba(240,138,128,.16);color:var(--bad)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 46px 58px 54px;gap:6px;align-items:center;font-size:13px}
.opt.hdr{font:600 10px var(--mono);color:var(--muted)}
.opt .nm{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .nm i{width:9px;height:9px;border-radius:2px;flex:none}
.opt.me{font-weight:800}
.opt .r{text-align:right;font-family:var(--mono)}
.fbar{height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--line-2)}
.coach summary{cursor:pointer;font-weight:700;font-size:13px;padding:4px 0;color:var(--gold-3)}
.coach ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.5}
.coach li b{margin-right:4px}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.statgrid .tile b{font-size:16px}
.chart svg{width:100%;height:auto;display:block}
/* villain styles */
.vlist{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow b{font-size:14px;min-width:46px}
.vrow small{flex:1;font:500 11px var(--mono);color:var(--muted)}
.vrow select,.allset select{font:700 13px var(--sans);color:var(--fg);background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;min-height:36px;padding:0 12px}
.allset{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.startbox{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid rgba(212,175,124,.55);background:#1C170F}
.startbox span{font-size:13px;color:var(--soft)}.startbox b{font:700 20px var(--mono);color:var(--gold-2)}
/* bust */
.bust{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:18px 0 4px}
.bust .zero{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#3A1A17,#1A0D0C);border:1px solid rgba(240,138,128,.5);font:700 18px var(--mono);color:var(--bad)}
.bust h2{margin:0;font-size:22px;font-weight:800}
.bust p{margin:0;font-size:14px;color:var(--soft)}
.nextbox{border:1px solid var(--line-2);border-radius:16px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;text-align:left}
.nextbox .r{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.nextbox .r b{color:var(--gold-2);font-size:18px}
.nextbox p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:#F0D7AE;color:#0B0A08;font-weight:700;border-radius:12px;padding:10px 14px;max-width:min(520px,calc(100% - 32px));font-size:14px}
.gate{display:flex;flex-direction:column;gap:12px;text-align:center;padding:30px 4px}
.gate h2{margin:0;font-size:20px}
.gate p{margin:0;color:var(--soft);font-size:14px;line-height:1.6}
</style>
</head>

<div class="app" id="app">
  <a class="solo-home" href="../">‹ ALLIN IQ 홈</a>
  <div class="hd"><div class="t"><h1>GTO 홀덤 테이블</h1><small id="sub">9인 MTT · 헤즈업 포스트플랍</small></div>
    <button class="pill" id="b-stats" type="button">통계</button><button class="pill" id="b-set" type="button">설정</button></div>

  <div id="main">
    <div class="table" id="table">
      <div class="rim"></div><div class="felt"></div>

  </div>
  <div id="gate" class="gate" hidden></div>
</div>
<div class="sheet" id="sheet" hidden><div class="body" id="sheet-body" role="dialog" aria-modal="true"></div></div>

<script>
// ===== cards.js : 카드 표기, 1326 콤보, 7카드 평가기 =====
// 카드 번호 = rank*4 + suit  (rank 0=2 ... 12=A, suit 0=c 1=d 2=h 3=s)  — Rust 솔버와 같은 규칙
const RANK_CH = '23456789TJQKA';
const SUIT_CH = 'cdhs';

function cardStr(c) { return RANK_CH[c >> 2] + SUIT_CH[c & 3]; }
function cardFromStr(s) { return RANK_CH.indexOf(s[0].toUpperCase()) * 4 + SUIT_CH.indexOf(s[1].toLowerCase()); }
function boardFromStr(s) { const out = []; for (let i = 0; i < s.length; i += 2) out.push(cardFromStr(s.substr(i, 2))); return out; }

// 1326 콤보: COMBO_C1[i] > COMBO_C2[i]
const COMBO_C1 = new Uint8Array(1326), COMBO_C2 = new Uint8Array(1326);
const COMBO_INDEX = new Int16Array(52 * 52).fill(-1);
(function () {

function fillOrder(order, pct, exclude) {

    if (!this.chartCache.map || this.chartCache.key) this.chartCache = { map: new Map() }; // 예전 형식(편집기가 {} 로 비움)도 받아줌
    const hit = this.chartCache.map.get(ck);
    if (hit) return hit;
    const pf = this.pushfoldFor(10);
    const base = _G.buildCharts(bucket, pf);
    const user = this.st.charts[bucket] || {};
    for (const [k, v] of Object.entries(user)) if (base[k]) base[k] = Float32Array.from(v);
    this.adjustLimpForICM(base, bucket);
    this.chartCache.map.set(ck, base);
    return base;
  }
  // 버블·파이널에서 SB 림프 줄이기 (11/5 결정): 림프 중 약한 쪽부터 줄이고, 그중 A·K 블로커 핸드는 레이즈로(25bb 이상), 나머지는 폴드.
  // 강한 트랩 림프(차트 상위)는 남김. 15bb 이하(림프/올인 구조)는 줄인 몫을 모두 폴드 — ICM에선 올인도 줄어서.
  adjustLimpForICM(C, bucket) {
    const k = this.stage().limp;
    if (!(k < 1) || !C['sb.limp']) return;
    const limp = C['sb.limp'], raise = C['sb.raise'], before = Float32Array.from(limp);
    const ord = _G.getOrd(); if (!ord) return;
    const total = _G.combosOf(limp);
    let cut = total * (1 - k);
    const weakFirst = [...ord.deep].reverse();
    for (const h of weakFirst) {
      if (cut <= 1e-9) break;
      if (limp[h] <= 0) continue;
      const n = _G.CLASS_COMBOS[h].length, take = Math.min(limp[h], cut / n);
      limp[h] -= take; cut -= take * n;
      const name = _G.className(h);
      if (bucket >= 25 && raise && /^[AK]/.test(name)) raise[h] = Math.min(1, raise[h] + take);
    }
    // 림프 뒤 BB 레이즈 대응 차트도 줄어든 림프 비율만큼 같이 줄임 (차트 합이 림프를 넘지 않게)
    for (const key of ['sbl.jam', 'sbl.call']) { const a = C[key]; if (!a) continue; for (let h = 0; h < 169; h++) if (before[h] > 0) a[h] *= limp[h] / before[h]; }
  }
  setEff(eff) {
    this.effS = eff;
    this.bucket = _G.bucketFor(eff);
    this.C = this.charts(this.bucket);
    this.pf = this.bucket === 10 ? this.pushfoldFor(eff) : null;
  }
  total(s) { return s.stack + s.inv; }
  ch(key) { const c = this.C[key]; return c || new Float32Array(169); }

  // ---------- 한 핸드 ----------
  async playHand() {
    const io = this.io, S = this.st;
    const stack = S.stack;
    this._icmCache = new Map();
    const deck = [...Array(52).keys()];
    for (let i = 51; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const heroPos = S.heroSeat === 'random' ? POSITIONS[Math.floor(this.rng() * 9)] : S.heroSeat;
    // 스택 (11/5): '자리마다 다르게'면 빌런 스택을 평균 = 시작 스택 근처로 흩뿌림(로그정규, 0.25~3배). 히어로는 시작 스택 그대로.
    const stackFor = pos => {
      if (pos === heroPos) return S.heroStack != null ? S.heroStack : stack; if (S.stackMode !== 'mixed') return stack;
      let z = 0; for (let k = 0; k < 6; k++) z += this.rng(); z = (z - 3) / Math.sqrt(0.5); // 대략 표준정규
      const x = Math.exp(0.5 * z - 0.125);
      return Math.max(5, Math.round(stack * Math.min(3, Math.max(0.25, x)) * 2) / 2);
    };
    const seats = POSITIONS.map(pos => { const st0 = stackFor(pos); return { pos, stack: st0, start: st0, inv: 0, cards: [deck.pop(), deck.pop()], folded: false, hero: pos === heroPos, lastAct: '' }; });
    this.T = seats.reduce((a, x) => a + x.start, 0);
    this.avgStack = this.T / 9;
    const by = Object.fromEntries(seats.map(s => [s.pos, s]));
    const h = this.hand = { seats, by, heroPos, deck, board: [], dead: 0, log: [], decisions: [], street: 'preflop', result: null, issues: [] };
    const put = (s, amt) => { amt = Math.min(amt, s.stack); s.stack -= amt; s.inv += amt; return amt; };
    put(by.SB, 0.5); put(by.BB, 1); by.SB.lastAct = 'SB 0.5'; by.BB.lastAct = 'BB 1';
    if (S.ante) { const a = Math.min(S.ante, by.BB.stack); by.BB.stack -= a; h.dead = a; }
    this.put = put;
    this.setEff(Math.min(by[heroPos].start, Math.max(...seats.filter(x => !x.hero).map(x => x.start))));
    // 차트 자체 점검 (구간이 바뀔 때 한 번)
    if (this._checkedBucket !== this.bucket + JSON.stringify(S.charts[this.bucket] || {})) {
      this._checkedBucket = this.bucket + JSON.stringify(S.charts[this.bucket] || {});
      const iss = _G.checkCharts(this.C);
      this.chartIssues = iss;
      if (iss.length && io.notice) io.notice('차트 점검: ' + iss.slice(0, 3).join(' / '));
    }
    this.render(); await io.wait(250);
    const st = this.style();
    const clsOf = s => _G.COMBO_CLASS[_G.COMBO_INDEX[s.cards[0] * 52 + s.cards[1]]];
    let openSize, sbRaise;

    // ===== 1) 퍼스트 인 =====
    let opener = null, openKind = null; // 'raise' | 'jam' | 'limp'
    for (const pos of POSITIONS.slice(0, 8)) {
      const s = by[pos], c = clsOf(s);
      // 유효 스택: 나와 뒤에 남은 사람 중 가장 큰 스택 중 작은 쪽 → 그 구간 차트
      const behindAll = POSITIONS.slice(POSITIONS.indexOf(pos) + 1).map(q => by[q]);
      this.setEff(Math.min(this.total(s), Math.max(...behindAll.map(x => this.total(x)))));
      openSize = S.openSize === 'auto' ? autoOpen(this.effS) : +S.openSize;
      sbRaise = this.effS >= 15 ? S.sbOpen : 3;
      const r = pos === 'SB' ? this.ch('sb.raise')[c] : this.ch(`rfi.${pos}.raise`)[c];
      const j = pos === 'SB' ? this.ch('sb.jam')[c] : (this.pf ? this.pf.jam[pos][c] : this.ch(`rfi.${pos}.jam`)[c]);
      const l = pos === 'SB' ? this.ch('sb.limp')[c] : 0;
      let act;
      if (s.hero) {
        const opts = [{ k: 'fold', label: '폴드', freq: Math.max(0, 1 - r - j - l) }];
        if (pos === 'SB') opts.push({ k: 'limp', label: '림프 (0.5 더)', freq: l });
        if (this.bucket > 10 || r > 0) opts.push({ k: 'raise', label: `레이즈 ${pos === 'SB' ? sbRaise : openSize}bb`, freq: r });
        opts.push({ k: 'jam', label: `올인 ${this.total(s).toFixed(1)}bb`, freq: j });
        // 올인 EV (폴드 에퀴티 포함)
        const behind = POSITIONS.slice(POSITIONS.indexOf(pos) + 1);
        const fj = this.firstInJamRange(pos);
        const jamRange = fj.some(x => x > 0) ? fj : this.rangeOf(pos, 'open');
        const jamInfo = this.jamEVvs(c, pos, behind.map(q => ({ pos: q, range: null })), jamRange, this.total(s));
        const jo = opts.find(o => o.k === 'jam'); jo.ev = jamInfo.ev; jo.chipEV = jamInfo.chipEV;
        opts[0].ev = 0; opts[0].chipEV = 0;
        act = await this.heroPre(opts, pos === 'SB' ? 'SB 퍼스트 인 차트' : '오픈 차트', { situation: 'open', pos, cls: c, jamInfo, thirtyRule: openSize > this.effS * 0.3 });
        act = act.k;
      } else {
        const st = this.style(pos), x = this.rng(), lm = st.loose;
        act = x < r * lm ? 'raise' : x < (r + j) * lm ? 'jam' : x < Math.min(1, (r + j + l) * lm) ? 'limp' : 'fold';
      }
      if (act === 'fold') { s.folded = true; s.lastAct = '폴드'; if (s.hero) return this.heroFoldPre(); this.render(); await io.wait(50); continue; }
      opener = pos; openKind = act;
      if (act === 'raise') { put(s, (pos === 'SB' ? sbRaise : openSize) - s.inv); s.lastAct = `레이즈 ${s.inv}`; }
      else if (act === 'jam') { put(s, s.stack); s.lastAct = '올인'; }
      else { put(s, 1 - s.inv); s.lastAct = '림프'; }
      this.logAct(pos, s.lastAct); this.render(); await io.wait(300);
      break;
    }
    if (!opener) { this.logText('모두 폴드 — BB 워크'); by.BB.lastAct = '워크'; return this.finish({ winner: [by.BB], reason: 'walk' }); }

    // ===== 2) SB 림프 → BB =====
    if (openKind === 'limp') return this.limpPot();

    // ===== 3) 오프너 이후: 히어로 전까지 봇은 폴드(헤즈업 단순화), 히어로 이후 첫 대응자만 =====
    const o = by[opener];
    const after = POSITIONS.slice(POSITIONS.indexOf(opener) + 1);
    const heroAfter = after.includes(heroPos);
    if (!o.hero && !heroAfter) return this.finish({ winner: null, reason: 'herofold' }); // 히어로는 이미 폴드
    let defender = null, defAct = null;
    for (const pos of after) {
      const s = by[pos];
      // 이미 대응자가 있거나, 히어로 앞의 봇이면 폴드 (헤즈업 단순화)
      const botBeforeHero = heroAfter && !s.hero && POSITIONS.indexOf(pos) < POSITIONS.indexOf(heroPos);
      if (!s.hero && (defender || botBeforeHero)) { s.folded = true; s.lastAct = '폴드'; continue; }
      const c = clsOf(s);
      const g = _G.groupOf(opener);
      const key = opener === 'SB' ? 'bbr' : `def.${g}.${pos}`;
      this.setEff(Math.min(this.total(s), this.total(o)));
      let act;
      if (openKind === 'jam') {
        // 올인 오픈에 콜/폴드: EV
        const range = this.rangeOf(opener, 'openJam');
        const toCall = Math.min(s.stack, o.inv - s.inv), finalPot = this.potTotal() + toCall - Math.max(0, (o.inv - s.inv) - toCall); // 콜하는 쪽이 짧으면 남는 칩은 돌려받음
        const ev = this.callEV(c, range, toCall, finalPot, s, o);
        if (s.hero) {
          const opts = [{ k: 'fold', label: '폴드', freq: ev.ev > 0 ? 0 : 1, ev: 0 }, { k: 'call', label: `콜 ${toCall.toFixed(1)}bb (올인)`, freq: ev.ev > 0 ? 1 : 0, ev: ev.ev }];
          act = (await this.heroPre(opts, '올인에 콜 (EV 계산)', { situation: 'vsJam', pos, cls: c, equity: ev.equity, need: ev.need, allinEV: ev, allin: true })).k;
        } else act = this.botCall(ev, pos) ? 'call' : 'fold';
      } else {
        const tb = this.ch(`${key}.threebet`)[c], jm = this.ch(`${key}.jam`)[c], cl = this.ch(`${key}.call`)[c];
        if (s.hero) {
          const tbSize = this.threeBetSize(pos, opener, o.inv, s);
          const opts = [{ k: 'fold', label: '폴드', freq: Math.max(0, 1 - tb - jm - cl), ev: 0 }, { k: 'call', label: `콜 ${(o.inv - s.inv).toFixed(1)}bb`, freq: cl }];
          if (tbSize < s.stack + s.inv - 1e-9) opts.push({ k: '3bet', label: `3벳 ${tbSize.toFixed(1)}bb`, freq: tb, size: tbSize });
          opts.push({ k: 'jam', label: `올인 ${(s.stack + s.inv).toFixed(1)}bb`, freq: jm + (tbSize >= s.stack + s.inv - 1e-9 ? tb : 0) });
          const jamInfo = this.jamEVvs(c, pos, [{ pos: opener, range: this.rangeOf(opener, 'open') }], this.rangeOf(pos, 'defJam', opener), s.stack + s.inv);
          opts.find(x => x.k === 'jam').ev = jamInfo.ev;
          const stackBehind = Math.min(s.stack, o.stack) - (o.inv - s.inv);
          act = (await this.heroPre(opts, opener === 'SB' ? 'BB vs SB 레이즈 차트' : `오픈 대응 차트 (vs ${POS_KO[opener]})`, { situation: 'vsOpen', pos, cls: c, jamInfo, impliedOdds: (stackBehind + this.potTotal() + (o.inv - s.inv)) / Math.max(0.01, o.inv - s.inv) })).k;
        } else {
          const x = this.rng(), st = this.style(pos);
          act = x < tb * st.aggr ? '3bet' : x < (tb + jm) * st.aggr ? 'jam' : x < Math.min(1, (tb + jm) * st.aggr + cl * st.loose) ? 'call' : 'fold';
          if (act === '3bet' && this.threeBetSize(pos, opener, o.inv, s) >= s.stack + s.inv - 1e-9) act = 'jam';
        }
      }
      if (act === 'fold') { s.folded = true; s.lastAct = '폴드'; if (s.hero) return this.heroFoldPre(); this.render(); await io.wait(60); continue; }
      defender = pos; defAct = act;
      if (act === 'call') { put(s, Math.min(s.stack, o.inv - s.inv)); s.lastAct = '콜'; }
      else if (act === '3bet') { const sz = this.threeBetSize(pos, opener, o.inv, s); put(s, sz - s.inv); s.lastAct = `3벳 ${sz.toFixed(1)}`; }
      else { put(s, s.stack); s.lastAct = '올인'; }
      this.logAct(pos, s.lastAct); this.render(); await io.wait(300);
    }
    if (!defender) { this.logText(`${POS_KO[opener]} 팟 획득`); return this.finish({ winner: [o], reason: o.hero ? 'fold' : 'fold' }); }
    const d = by[defender];
    this.setEff(Math.min(this.total(o), this.total(d)));

    // ===== 4) 3벳/올인 이후 =====
    if (defAct === '3bet' || defAct === 'jam') {
      const c = clsOf(o);
      let resp;
      if (defAct === 'jam' || d.stack <= 1e-9) {
        // 3벳 올인 → 오프너 콜/폴드 (EV)
        const range = this.rangeOf(defender, 'defJam', opener);
        const toCall = Math.min(o.stack, d.inv - o.inv), finalPot = this.potTotal() + toCall - Math.max(0, (d.inv - o.inv) - toCall); // 콜하는 쪽이 짧으면 남는 칩은 돌려받음
        const ev = this.callEV(c, range, toCall, finalPot, o, d);
        if (o.hero) {
          const opts = [{ k: 'fold', label: '폴드', freq: ev.ev > 0 ? 0 : 1, ev: 0 }, { k: 'call', label: `콜 ${toCall.toFixed(1)}bb (올인)`, freq: ev.ev > 0 ? 1 : 0, ev: ev.ev }];
          resp = (await this.heroPre(opts, '3벳 올인에 콜 (EV 계산)', { situation: 'vsJam', pos: opener, cls: c, equity: ev.equity, need: ev.need, allinEV: ev, allin: true })).k;
        } else resp = this.botCall(ev, o.pos) ? 'call' : 'fold';
      } else {
        const key = `vs3b.${opener}`;
        const f4 = this.ch(`${key}.fourbet`)[c], c3 = this.ch(`${key}.call`)[c];
        const fbSize = this.fourBetSize(opener, defender, d.inv, o), fbAllin = fbSize >= o.stack + o.inv - 1e-9;
        if (o.hero) {
          const opts = [{ k: 'fold', label: '폴드', freq: Math.max(0, 1 - f4 - c3), ev: 0 }, { k: 'call', label: `콜 ${(d.inv - o.inv).toFixed(1)}bb`, freq: c3 }, { k: 'jam', label: fbAllin ? `4벳 올인 ${(o.stack + o.inv).toFixed(1)}bb` : `4벳 ${fbSize.toFixed(1)}bb`, freq: f4 }];
          const jamInfo = fbAllin ? this.jamEVvs(c, opener, [{ pos: defender, range: this.rangeOf(defender, 'def3bet', opener) }], this.rangeOf(opener, 'fourbet'), o.stack + o.inv) : null;
          if (jamInfo) opts[2].ev = jamInfo.ev;
          resp = (await this.heroPre(opts, '3벳 대응 차트', { situation: 'vs3bet', pos: opener, cls: c, jamInfo, fourBetSize: fbAllin ? null : fbSize, mdf: 1 - d.inv / this.potTotal() })).k; // MDF: 3벳한 쪽이 건 총액 기준 (2차 점검 수정)
        } else { const x = this.rng(), st = this.style(opener); resp = x < f4 * st.aggr ? 'jam' : x < f4 * st.aggr + c3 * st.loose ? 'call' : 'fold'; }
        if (resp === 'jam' && !fbAllin) return this.facing4bet(o, d, opener, defender, fbSize, clsOf);
        if (resp === 'jam') {
          put(o, o.stack); o.lastAct = '4벳 올인'; this.logAct(opener, o.lastAct); this.render(); await io.wait(300);
          const dc = clsOf(d);
          const toCall = Math.min(d.stack, o.inv - d.inv), finalPot = this.potTotal() + toCall - Math.max(0, (o.inv - d.inv) - toCall); // 콜하는 쪽이 짧으면 남는 칩은 돌려받음
          const ev = this.callEV(dc, this.rangeOf(opener, 'fourbet'), toCall, finalPot, d, o);
          let call;
          if (d.hero) {
            const opts = [{ k: 'fold', label: '폴드', freq: ev.ev > 0 ? 0 : 1, ev: 0 }, { k: 'call', label: `콜 ${toCall.toFixed(1)}bb (올인)`, freq: ev.ev > 0 ? 1 : 0, ev: ev.ev }];
            call = (await this.heroPre(opts, '4벳 올인에 콜 (EV 계산)', { situation: 'vsJam', pos: defender, cls: dc, equity: ev.equity, need: ev.need, allinEV: ev, allin: true })).k === 'call';
          } else call = this.botCall(ev, d.pos);
          if (!call) { d.folded = true; d.lastAct = '폴드'; this.logAct(defender, '폴드'); if (d.hero) return this.heroFoldPre(true); return this.finish({ winner: [o], reason: 'fold' }); }
          put(d, toCall); d.lastAct = '콜'; this.logAct(defender, '콜');
          return this.goPostflop(o, d, null, null, true);
        }
      }
      if (resp === 'fold') { o.folded = true; o.lastAct = '폴드'; this.logAct(opener, '폴드'); if (o.hero) return this.heroFoldPre(true); return this.finish({ winner: [d], reason: 'fold' }); }
      put(o, Math.min(o.stack, d.inv - o.inv)); o.lastAct = '콜'; this.logAct(opener, '콜');
      this.render(); await io.wait(250);
      if (defAct === 'jam' || d.stack <= 1e-9 || o.stack <= 1e-9) return this.goPostflop(o, d, null, null, true);
      return this.goPostflop(o, d, this.rangeOf(opener, 'call3bet'), this.rangeOf(defender, 'def3bet', opener), false, '3벳팟', d);
    }
    // 콜
    if (o.stack <= 1e-9 || d.stack <= 1e-9) return this.goPostflop(o, d, null, null, true);
    return this.goPostflop(o, d, this.rangeOf(opener, 'open'), this.rangeOf(defender, 'defCall', opener), false, '싱글 레이즈 팟', o);
  }

  // SB 림프 팟
  async limpPot() {
    const io = this.io, h = this.hand, by = h.by, sb = by.SB, bb = by.BB, st = this.style();
    const c = _G.COMBO_CLASS[_G.COMBO_INDEX[bb.cards[0] * 52 + bb.cards[1]]];
    this.setEff(Math.min(this.total(sb), this.total(bb)));
    const isoSize = this.effS >= 25 ? 3.5 : 3;
    const r = this.ch('bbl.raise')[c], j = this.ch('bbl.jam')[c];
    let act;
    if (bb.hero) {
      const opts = [{ k: 'check', label: '체크', freq: Math.max(0, 1 - r - j), ev: null }, { k: 'raise', label: `레이즈 ${isoSize}bb`, freq: r }, { k: 'jam', label: `올인 ${(bb.stack + bb.inv).toFixed(1)}bb`, freq: j }];
      const jamInfo = this.jamEVvs(c, 'BB', [{ pos: 'SB', range: this.ch('sb.limp'), callKey: 'sbLimp' }], this.ch('bbl.jam'), bb.stack + bb.inv);
      opts[2].ev = jamInfo.ev;
      act = (await this.heroPre(opts, 'BB vs SB 림프 차트', { situation: 'vsLimp', pos: 'BB', cls: c, jamInfo })).k;
    } else { const x = this.rng(), st = this.style('BB'); act = x < r * st.aggr ? 'raise' : x < (r + j) * st.aggr ? 'jam' : 'check'; }
    if (act === 'check') { bb.lastAct = '체크'; this.logAct('BB', '체크'); return this.goPostflop(sb, bb, this.ch('sb.limp'), this.complement(['bbl.raise', 'bbl.jam']), false, '림프 팟'); }
    if (act === 'raise') { this.put(bb, isoSize - bb.inv); bb.lastAct = `레이즈 ${isoSize}`; } else { this.put(bb, bb.stack); bb.lastAct = '올인'; }
    this.logAct('BB', bb.lastAct); this.render(); await io.wait(300);
    // SB 대응
    const sc = _G.COMBO_CLASS[_G.COMBO_INDEX[sb.cards[0] * 52 + sb.cards[1]]];
    let resp;
    if (act === 'jam' || bb.stack <= 1e-9) {
      const toCall = Math.min(sb.stack, bb.inv - sb.inv), finalPot = this.potTotal() + toCall - Math.max(0, (bb.inv - sb.inv) - toCall); // 콜하는 쪽이 짧으면 남는 칩은 돌려받음
      const ev = this.callEV(sc, this.ch('bbl.jam'), toCall, finalPot, sb, bb);
      if (sb.hero) {
        const opts = [{ k: 'fold', label: '폴드', freq: ev.ev > 0 ? 0 : 1, ev: 0 }, { k: 'call', label: `콜 ${toCall.toFixed(1)}bb (올인)`, freq: ev.ev > 0 ? 1 : 0, ev: ev.ev }];
        resp = (await this.heroPre(opts, '림프 후 올인에 콜 (EV)', { situation: 'vsJam', pos: 'SB', cls: sc, equity: ev.equity, need: ev.need, allinEV: ev, allin: true })).k;
      } else resp = this.botCall(ev, 'SB') ? 'call' : 'fold';
    } else {
      const lj = this.ch('sbl.jam')[sc], lc = this.ch('sbl.call')[sc], lim = Math.max(1e-9, this.ch('sb.limp')[sc]);
      const fj = Math.min(1, lj / lim), fc = Math.min(1 - fj, lc / lim);
      if (sb.hero) {
        const opts = [{ k: 'fold', label: '폴드', freq: Math.max(0, 1 - fj - fc), ev: 0 }, { k: 'call', label: `콜 ${(bb.inv - sb.inv).toFixed(1)}bb`, freq: fc }, { k: 'jam', label: `올인 ${(sb.stack + sb.inv).toFixed(1)}bb`, freq: fj }];
        const jamInfo = this.jamEVvs(sc, 'SB', [{ pos: 'BB', range: this.ch('bbl.raise') }], this.ch('sbl.jam'), sb.stack + sb.inv);
        opts[2].ev = jamInfo.ev;
        resp = (await this.heroPre(opts, 'SB 림프 후 레이즈 대응 차트', { situation: 'vs3bet', pos: 'SB', cls: sc, jamInfo })).k;
      } else { const x = this.rng(), st = this.style('SB'); resp = x < fj * st.aggr ? 'jam' : x < fj * st.aggr + fc * st.loose ? 'call' : 'fold'; }
      if (resp === 'jam') {
        this.put(sb, sb.stack); sb.lastAct = '올인'; this.logAct('SB', '올인'); this.render(); await io.wait(300);
        const toCall = Math.min(bb.stack, sb.inv - bb.inv), finalPot = this.potTotal() + toCall - Math.max(0, (sb.inv - bb.inv) - toCall); // 콜하는 쪽이 짧으면 남는 칩은 돌려받음
        const ev = this.callEV(c, this.ch('sbl.jam'), toCall, finalPot, bb, sb);
        let call;
        if (bb.hero) {
          const opts = [{ k: 'fold', label: '폴드', freq: ev.ev > 0 ? 0 : 1, ev: 0 }, { k: 'call', label: `콜 ${toCall.toFixed(1)}bb (올인)`, freq: ev.ev > 0 ? 1 : 0, ev: ev.ev }];
          call = (await this.heroPre(opts, 'SB 림프-올인에 콜 (EV)', { situation: 'vsJam', pos: 'BB', cls: c, equity: ev.equity, need: ev.need, allinEV: ev, allin: true })).k === 'call';
        } else call = this.botCall(ev, 'BB');
        if (!call) { bb.folded = true; bb.lastAct = '폴드'; this.logAct('BB', '폴드'); if (bb.hero) return this.heroFoldPre(true); return this.finish({ winner: [sb], reason: 'fold' }); }
        this.put(bb, toCall); bb.lastAct = '콜'; this.logAct('BB', '콜');
        return this.goPostflop(sb, bb, null, null, true);
      }
    }
    if (resp === 'fold') { sb.folded = true; sb.lastAct = '폴드'; this.logAct('SB', '폴드'); if (sb.hero) return this.heroFoldPre(true); return this.finish({ winner: [bb], reason: 'fold' }); }
    this.put(sb, Math.min(sb.stack, bb.inv - sb.inv)); sb.lastAct = '콜'; this.logAct('SB', '콜');
    if (sb.stack <= 1e-9 || bb.stack <= 1e-9) return this.goPostflop(sb, bb, null, null, true);
    return this.goPostflop(sb, bb, this.ch('sbl.call'), this.ch('bbl.raise'), false, '림프-레이즈 팟', bb);
  }

  complement(keys) { const o = new Float32Array(169).fill(1); for (const k of keys) { const c = this.ch(k); for (let i = 0; i < 169; i++) o[i] = Math.max(0, o[i] - c[i]); } return o; }

  // 상황별 레인지
  firstInJamRange(pos) { return pos === 'SB' ? this.ch('sb.jam') : (this.pf ? this.pf.jam[pos] : this.ch(`rfi.${pos}.jam`)); }
  rangeOf(pos, kind, opener) {
    const g = opener ? _G.groupOf(opener) : null;
    const key = opener === 'SB' ? 'bbr' : `def.${g}.${pos}`;
    const nz = r => r.some(x => x > 0);
    switch (kind) {
      case 'open': return pos === 'SB' ? this.ch('sb.raise') : this.ch(`rfi.${pos}.raise`);
      case 'openJam': { const r = this.firstInJamRange(pos); return nz(r) ? r : this.rangeOf(pos, 'open'); }
      case 'defCall': return this.ch(`${key}.call`);
      case 'def3bet': return this.ch(`${key}.threebet`);
      case 'defJam': { const j = this.ch(`${key}.jam`); const t = this.ch(`${key}.threebet`); return nz(j) ? (nz(t) ? j.map((x, k) => x + t[k]) : j) : t; }
      case 'fourbet': { const f = this.ch(`vs3b.${pos}.fourbet`); return nz(f) ? f : _G.fillOrder(_G.getOrd().value, 3); }
      case 'call3bet': return this.ch(`vs3b.${pos}.call`);
    }
    return new Float32Array(169).fill(1);
  }

  // 올인 아닌 4벳 이후 (자료 A rev 35, 10/29): 3벳한 쪽은 폴드 또는 5벳 올인, 오프너는 콜/폴드.
  // 4벳 뒤 남는 스택이 팟보다 작아(SPR 1 안팎) 플랫 콜은 두지 않고 올인으로 단순화. 5벳 올인 EV는 오프너가 4벳 레인지 전체로 콜한다고 보고 계산(보수적).
  async facing4bet(o, d, opener, defender, fbSize, clsOf) {
    const io = this.io, put = this.put;
    put(o, fbSize - o.inv); o.lastAct = `4벳 ${fbSize.toFixed(1)}`; this.logAct(opener, o.lastAct); this.render(); await io.wait(300);
    const fourR = this.rangeOf(opener, 'fourbet'), defR = this.rangeOf(defender, 'def3bet', opener);
    const dPut = Math.min(d.stack, o.inv + o.stack - d.inv), oPut = Math.min(o.stack, d.inv + dPut - o.inv);
    const finalPot = this.potTotal() + dPut + oPut;
    const dc = clsOf(d);
    const ev = this.callEV(dc, fourR, dPut, finalPot, d, o);
    let jam;
    if (d.hero) {
      const opts = [{ k: 'fold', label: '폴드', freq: ev.ev > 0 ? 0 : 1, ev: 0 }, { k: 'jam', label: `5벳 올인 ${(d.stack + d.inv).toFixed(1)}bb`, freq: ev.ev > 0 ? 1 : 0, ev: ev.ev }];
      jam = (await this.heroPre(opts, '4벳 대응 (EV 계산)', { situation: 'vsJam', pos: defender, cls: dc, equity: ev.equity, need: ev.need, allinEV: ev, allin: true })).k === 'jam';
    } else jam = this.botCall(ev, d.pos);
    if (!jam) { d.folded = true; d.lastAct = '폴드'; this.logAct(defender, '폴드'); if (d.hero) return this.heroFoldPre(true); return this.finish({ winner: [o], reason: 'fold' }); }
    put(d, dPut); d.lastAct = '5벳 올인'; this.logAct(defender, d.lastAct); this.render(); await io.wait(300);
    // 오프너가 보는 5벳 올인 레인지: 3벳 레인지 중 4벳 레인지 상대로 올인 EV가 양수인 핸드
    const jamR = new Float32Array(169); // ev.need = 3벳한 쪽이 4벳 상대로 올인할 때 필요한 승률 (단계가 ICM이면 ICM 기준)
    for (let k = 0; k < 169; k++) if (defR[k] > 0) { const e = _G.eqHR(k, fourR); if (e > ev.need) jamR[k] = defR[k]; }
    const oc = clsOf(o);
    const ev2 = this.callEV(oc, jamR.some(x => x > 0) ? jamR : _G.fillOrder(_G.getOrd().value, 3), oPut, finalPot, o, d);
    let call;
    if (o.hero) {
      const opts = [{ k: 'fold', label: '폴드', freq: ev2.ev > 0 ? 0 : 1, ev: 0 }, { k: 'call', label: `콜 ${oPut.toFixed(1)}bb (올인)`, freq: ev2.ev > 0 ? 1 : 0, ev: ev2.ev }];
      call = (await this.heroPre(opts, '5벳 올인에 콜 (EV 계산)', { situation: 'vsJam', pos: opener, cls: oc, equity: ev2.equity, need: ev2.need, allinEV: ev2, allin: true })).k === 'call';
    } else call = this.botCall(ev2, o.pos);
    if (!call) { o.folded = true; o.lastAct = '폴드'; this.logAct(opener, '폴드'); if (o.hero) return this.heroFoldPre(true); return this.finish({ winner: [d], reason: 'fold' }); }
    put(o, oPut); o.lastAct = '콜'; this.logAct(opener, '콜');
    return this.goPostflop(o, d, null, null, true);
  }

  // me/opp 를 안 주면 칩 EV만 (예전 방식)
  callEV(c, range, toCall, finalPot, me, opp) {
    const e = _G.eqHR(c, range), chipNeed = toCall / finalPot, chipEV = e * finalPot - toCall;
    if (!me || !opp) return { equity: e, need: chipNeed, chipNeed, ev: chipEV, chipEV, toCall, finalPot, icm: false };
    const icm = this.icmOn();
    const n = this.needOf(me, opp)[icm ? 'icm' : 'chip'];
    const ev = (e * n.w + (1 - e) * n.l - n.f) * this.T;
    return { equity: e, need: n.need, chipNeed, ev, chipEV, toCall, finalPot, icm };
  }
  botCall(ev, pos) { const edge = this.style(pos).callEdge || 0; return ev.equity > ev.need + edge; }

  // 올인 EV: 남은 상대들이 '이 잼 레인지'에 대해 EV>0 이면 콜한다고 가정 (상대의 콜 기준도 같은 단계 기준: ICM이면 ICM)
  // others: [{pos, range}] range=null 이면 아직 액션 전(전체 핸드). 칩 EV 결과(chipEV)도 같이 돌려줘서 비교에 씀.
  jamEVvs(c, pos, others, myJamRange, myTotal) {
    const run = icm => this._jamEV(c, pos, others, myJamRange, myTotal, icm);
    const chip = run(false);
    if (!this.icmOn()) return { ...chip, chipEV: chip.ev, chipPFold: chip.pFold, icm: false };
    const r = run(true);
    return { ...r, chipEV: chip.ev, chipPFold: chip.pFold, icm: true };
  }
  _jamEV(c, pos, others, myJamRange, myTotal, icm) {
    const h = this.hand, me = h.by[pos], pot = this.potTotal();
    const ov = { [pos]: { pos, stack: this.total(me) - myTotal, inv: myTotal } };
    // 기준(지금 폴드): 내 칩은 그대로, 팟은 가장 많이 넣은 다른 사람에게
    const base = {}; for (const s of h.seats) base[s.pos] = s.stack;
    const taker = h.seats.filter(x => x !== me).reduce((a, b) => (b.inv > a.inv ? b : a));
    const F0 = { ...base }; F0[taker.pos] += pot;
    const v0 = this.valueOf(F0, pos, icm);
    const N = { ...base }; N[pos] = me.stack + pot;                  // 모두 폴드
    const jr = myJamRange && myJamRange.some(x => x > 0) ? myJamRange : new Float32Array(169).fill(1);
    let pNone = 1, ev = 0, eqCalled = 0, wsum = 0;
    for (const ot of others) {
      const s = h.by[ot.pos];
      const vr = ot.range || new Float32Array(169).fill(1);
      // 콜러 기준 필요 승률 (내 올인 뒤 상태 가정)
      const nq = this.needOf(s, me, ov)[icm ? 'icm' : 'chip'].need;
      const callR = new Float32Array(169);
      for (let k = 0; k < 169; k++) if (vr[k] > 0 && _G.eqHR(k, jr) > nq) callR[k] = vr[k];
      const pc = _G.pCallGivenHand(c, callR, vr);
      const e = callR.some(x => x > 0) ? _G.eqHR(c, callR) : 0.5;
      const d = this.duelStacks(me, s, ov);
      ev += pNone * pc * (e * this.valueOf(d.W, pos, icm) + (1 - e) * this.valueOf(d.L, pos, icm) - v0);
      eqCalled += pNone * pc * e; wsum += pNone * pc;
      pNone *= (1 - pc);
    }
    ev += pNone * (this.valueOf(N, pos, icm) - v0);
    return { ev: ev * this.T, pFold: pNone, eqCalled: wsum ? eqCalled / wsum : 0 };
  }

  // 자료 A rev 35(10/29): 40bb 구간(32~55bb)의 4벳은 올인이 아니라 3벳의 약 2배.
  // 30% 규칙은 이 4벳에는 적용하지 않음. 남은 스택이 너무 적으면(4벳이 스택의 45% 이상) 올인.
  fourBetSize(opener, defender, threeBetTo, o) {
    const total = o.stack + o.inv;
    if (this.bucket !== 40 && this.bucket !== 75) return total;
    const ip = POSTFLOP_ORDER.indexOf(opener) > POSTFLOP_ORDER.indexOf(defender);
    const mult = this.bucket === 75 ? (ip ? 2.5 : 2.75) : (ip ? 12 / 6.3 : 13 / 6.3);
    const sz = Math.round(threeBetTo * mult * 10) / 10;
    return sz >= total * 0.45 ? total : Math.min(sz, total);
  }

  threeBetSize(pos, opener, openAmt, s) {
    const ip = POSTFLOP_ORDER.indexOf(pos) > POSTFLOP_ORDER.indexOf(opener);
    const S = this.effS ?? this.st.stack;
    // 자료 A rev 35(10/29): 35bb 미만 IP가 앞·중간 포지션(UTG~HJ) 오픈에 3벳하면 오픈의 2.5배(작은 3벳)
    const smallIP = ip && S < 35 && ['EP', 'MP'].includes(_G.groupOf(opener));
    const mult = ip ? (S >= 35 ? 3 : smallIP ? 2.5 : 2.75) : (S >= 60 ? 4.4 : S >= 35 ? 4 : 3.5);
    let sz = openAmt * mult;
    if (sz >= (s.stack + s.inv) * 0.3) sz = s.stack + s.inv; // 30% 규칙
    return Math.min(sz, s.stack + s.inv);
  }

  async heroPre(opts, chartName, ctx = {}) {
    const h = this.hand;
    const i = await this.io.heroAction({ street: 'preflop', options: opts.map(o => ({ label: o.label, kind: o.k, freq: o.freq, ev: o.ev ?? null })), chartName, pot: this.potTotal(), hud: this.hud() });
    const o = opts[i];
    // 칩 EV 값 채우기 (ICM 비교용)
    for (const x of opts) {
      if (x.chipEV != null) continue;
      if (x.k === 'fold' && x.ev === 0) x.chipEV = 0;
      else if (ctx.allinEV && x.ev === ctx.allinEV.ev) x.chipEV = ctx.allinEV.chipEV;
      else if (ctx.jamInfo && x.k === 'jam' && x.ev === ctx.jamInfo.ev) x.chipEV = ctx.jamInfo.chipEV;
    }
    const cls = _G.className(ctx.cls ?? _G.COMBO_CLASS[_G.COMBO_INDEX[h.by[h.heroPos].cards[0] * 52 + h.by[h.heroPos].cards[1]]]);
    // 채점: 모든 선택지에 EV 가 있으면 EV 기준, 아니면 차트 빈도 기준
    const allEV = opts.every(x => x.ev != null && isFinite(x.ev));
    let best, loss = 0, grade;
    if (allEV) {
      const bestEV = Math.max(...opts.map(x => x.ev)); best = opts.findIndex(x => x.ev === bestEV);
      loss = Math.max(0, bestEV - o.ev);
      grade = loss < 0.1 ? 'good' : loss < 0.6 ? 'ok' : 'bad';
    } else {
      best = opts.reduce((b, x, k) => x.freq > opts[b].freq ? k : b, 0);
      grade = o.freq >= 0.25 ? 'good' : o.freq >= 0.05 ? 'ok' : 'bad';
      // 올인을 골랐고 EV 가 음수면 실수로 강등
      if (o.ev != null && o.ev < -0.5 && grade !== 'bad') grade = 'ok';
    }
    const notes = _G.preflopNotes({ ...ctx, stack: this.effS ?? this.st.stack, icmName: this.icmOn() ? this.stage().name.replace(' (ICM)', '') : null, posKo: POS_KO[ctx.pos || h.heroPos], cls, options: opts.map(x => ({ label: x.label, kind: x.k, freq: x.freq, ev: x.ev })), chosen: i, best });
    const dec = { street: 'preflop', chartName, cls, options: opts.map(x => ({ label: x.label, kind: x.k, freq: x.freq, ev: x.ev ?? null, chipEV: x.chipEV ?? null })), chosen: i, best, grade, evLoss: allEV ? loss : 0, preEV: allEV, notes, stacks: this.stackInfo() };
    // 칩 EV와 ICM 비교: 두 기준의 1순위가 다르면 표시
    if (this.icmOn() && allEV && opts.every(x => x.chipEV != null)) {
      const cb = Math.max(...opts.map(x => x.chipEV)), chipBest = opts.findIndex(x => x.chipEV === cb);
      dec.icmCmp = { stage: this.stage().name.replace(' (ICM)', ''), chipBest, best, differ: chipBest !== best };
    }
    dec.issues = _G.checkDecision(dec);
    h.decisions.push(dec);
    this.stats.preDecisions++; this.stats.decisions++;
    if (allEV) { this.stats.preLoss += loss; this.stats.evLoss += loss; }
    if (grade === 'bad') this.stats.preMistakes++; else this.stats.good++;
    if (this.st.feedback === 'each' && this.io.feedback) await this.io.feedback(dec);
    return o;
  }
  heroFoldPre() {
    const h = this.hand, me = h.by[h.heroPos];
    me.folded = true; me.lastAct = '폴드'; this.logAct(h.heroPos, '폴드');
    return this.finish({ winner: null, reason: 'herofold' });
  }

  // ---------- 포스트플랍 진입 ----------
  async goPostflop(a, b, ra, rb, allin, potType, aggressor = null) {
    const h = this.hand;
    const pair = [a, b].sort((x, y) => POSTFLOP_ORDER.indexOf(x.pos) - POSTFLOP_ORDER.indexOf(y.pos));
    h.oop = pair[0]; h.ip = pair[1];
    h.potType = allin ? '올인' : potType;
    h.aggressor = aggressor;
    if (allin) return this.runoutShowdown();
    const r1326 = r => _G.to1326(r);
    const rOf = s => s === a ? ra : rb;
    h.ranges = [r1326(rOf(h.oop)), r1326(rOf(h.ip))];
    this.render(); await this.io.wait(250);
    return this.postflop();
  }

  async postflop() {
    const h = this.hand, S = this.st, io = this.io, prec = PRECISION[S.precision] || PRECISION.normal;
    const nBoard = [3, 1, 1];
    for (let street = 0; street < 3; street++) {
      for (let k = 0; k < nBoard[street]; k++) h.board.push(h.deck.pop());
      h.street = ['flop', 'turn', 'river'][street];
      const pot = this.potTotal();
      const stack = Math.min(h.oop.stack, h.ip.stack);
      h.streetStartPot = pot; h.streetStack = stack;
      h.oop.lastAct = ''; h.ip.lastAct = '';
      this.logText(`— ${['플랍', '턴', '리버'][street]} ${h.board.map(_G.cardStr).join(' ')} · 팟 ${pot.toFixed(1)}bb · SPR ${(stack / pot).toFixed(1)}`);
      this.render();
      const cfg = {
        board: h.board.slice(), ranges: h.ranges, pot, stack,
        sizes: S.sizes, maxRaises: S.maxRaises, turnCards: prec.turnCards, roRivers: prec.roRivers, minWeight: 0.002,
        flopRiverCards: prec.flopRiverCards || 0, flopRiverMaxRaises: prec.flopRiverMaxRaises ?? 1,
        forceCombos: [h.oop, h.ip].map(s => _G.COMBO_INDEX[s.cards[0] * 52 + s.cards[1]]),
      };
      let d = new _G.DistSolver(cfg, io.endpoints || []);
      await d.init();
      io.solving({ street: h.street, iter: 0, maxIter: prec.maxIter, expl: null, ms: 0, done: false });
      const ex = await d.solve({ maxIter: prec.maxIter, targetPct: prec.targetPct, checkEvery: 10, onProgress: p => io.solving({ street: h.street, ...p, done: false }) });
      io.solving({ street: h.street, iter: d.master.iter, maxIter: prec.maxIter, expl: ex ? ex.pct : null, done: true });
      h.solverExpl = ex ? ex.pct : null;
      let m = d.master;
      // 스트리트 레인지 정보 (코칭용)
      h.streetInfo = streetRangeInfo(m, h.board);
      let path = [];
      let node = m.root;
      while (node.t === 'A') {
        const actor = node.p === 0 ? h.oop : h.ip;
        h.toAct = actor.pos;
        this.render();
        let a;
        if (actor.hero) {
          let q = await d.query(path);
          let hi = m.handIndex(node.p, cfg.forceCombos[node.p]);
          const mkOpts = () => node.acts.map((ac, k) => ({ label: this.actLabel(ac, node, actor), kind: ac.k, freq: q.strat[k * q.n + hi], ev: q.evA[k][hi] }));
          let opts = mkOpts();
          const villRange = m.reachAt(path)[1 - node.p];
          const hud = this.hud(node, villRange, 1 - node.p, m);
          a = await io.heroAction({ street: h.street, options: opts.map(o => ({ label: o.label, kind: o.kind, freq: o.freq, ev: o.ev })), hud, pot: this.potTotal(), sizing: this.sizing(node) });
          if (a && typeof a === 'object') {
            const agg = ac => ac.k === 'bet' || ac.k === 'raise' || ac.k === 'allin';
            const X = Math.min(+a.to, h.streetStack), tol = Math.max(0.05, 0.02 * (h.streetStartPot + node.c0 + node.c1));
            let k = node.acts.findIndex(ac => agg(ac) && Math.abs(ac.to - X) <= tol);
            if (k < 0) {
              const cfg2 = { ...cfg, turnCards: h.street === 'flop' ? Math.min(cfg.turnCards || 99, PRECISION.normal.turnCards) : cfg.turnCards, ranges: m.rangesAfter(path), rootState: { c: [node.c0, node.c1], base: node.base || 0, toAct: node.p, raises: node.raises || 0, checked: !!node.checked, extra: X } };

  g.innerHTML = `<div class="bust"><div class="zero">0BB</div><h2>스택을 모두 잃었어요</h2><p>이번 판은 여기까지예요. ${A.h}핸드 동안 버텼어요.</p></div>
    <div class="statgrid">
      <div class="tile"><span>친 핸드</span><b>${A.h}</b></div><div class="tile"><span>최고 스택</span><b>${fmt(A.best)}BB</b></div><div class="tile hl"><span>EV 손실 합</span><b>${fmt(A.ev, 1)}</b></div>
      <div class="tile hl"><span>EV 손실 /100핸드</span><b>${A.h ? fmt(A.ev / A.h * 100, 1) : '–'}</b></div><div class="tile"><span>GTO 일치율</span><b>${acc}</b></div><div class="tile"><span>마지막 핸드</span><b>#${A.th}</b></div></div>
    <div class="nextbox"><div class="r"><span>다음 ${c.start}BB</span><b>${grantText(t)}</b></div>
      <p>탈락하면 다시 받을 때까지 칠 수 없어요(관리자가 정한 규칙: ${c.regrant === 'week' ? '매주 월요일 0시' : c.regrant === 'admin' ? '관리자가 줄 때' : '매일 0시'}에 새 ${c.start}BB). 그동안 핸드 퀴즈·오픈 연습은 그대로 할 수 있어요.</p></div>
    <div class="btns">${lastHand ? '<button class="ghost" id="bz-last" type="button">마지막 핸드 보기</button>' : ''}<button class="primary" id="bz-quiz" type="button">핸드 퀴즈 하러 가기</button></div>`;
  const l = $('bz-last'); if (l) l.onclick = () => openSheet(handEndHtml(lastHand.v, lastHand.n) + '<button class="ghost" id="x2" type="button">닫기</button>', b => b.querySelector('#x2').onclick = closeSheet);
  $('bz-quiz').onclick = () => ST.quiz();
  renderChips();
  if (t !== Infinity) { clearTimeout(showBust._t); showBust._t = setTimeout(async () => { if (await loadAcct() && A.s > 0) showTable(); }, Math.min(Math.max(1000, t - Date.now() + 1500), 6 * 36e5)); }
}
function showTable() {
  $('gate').hidden = true; $('main').hidden = false;
  renderChips();
  const heroSeat = heroPosFor(A.th);
  const demo = { heroPos: heroSeat, board: [], pot: 0, seats: POSITIONS.map(p => ({ pos: p, stack: p === heroSeat ? A.s : cfg().start, inv: 0, folded: false, hero: p === heroSeat, lastAct: '', cards: p === heroSeat ? [null, null] : null, inHand: false })), log: [] };
  prepHand(); renderTable(demo);
  $('b-start').hidden = false; $('b-start').textContent = A.h ? `이어서 치기 · 내 스택 ${fmt(A.s)}BB` : `게임 시작 · ${fmt(A.s)}BB`;
  $('status').textContent = ''; wait('');
}

// ---------- 설정: 빌런 8명 성향 ----------
function styleSel(v, id) { return `<select id="${id}" aria-label="성향">${STYLE_KEYS.map(k => `<option value="${k}"${k === v ? ' selected' : ''}>${VILLAIN_STYLES[k].name}</option>`).join('')}</select>`; }
function openSettings() {
  const c = cfg(), s8 = styles8(), hp = heroPosFor(A ? A.th : 0);
  openSheet(`<div class="sheethead"><h2>테이블 설정</h2><button class="closebtn" id="s-x" type="button">닫기</button></div>
    <div class="startbox"><span>시작 스택</span><b>${c.start}BB</b></div>
    <p class="meta" style="font-size:13px;line-height:1.6">힌트 없이 치고, 빌런은 솔버 전략을 바탕으로 둬요. 스택을 다 잃으면 이번 판은 끝나요. 빌런 1은 내 왼쪽 자리이고, 버튼이 돌면 자리 이름도 같이 바뀌어요.</p>
    <div class="allset"><span>빌런 8명 성향</span><select id="s-all" aria-label="한 번에 바꾸기"><option value="" selected>한 번에 바꾸기</option>${STYLE_KEYS.map(k => `<option value="${k}">${VILLAIN_STYLES[k].name}</option>`).join('')}</select></div>
    <div class="vlist">${s8.map((v, i) => `<div class="vrow"><b>빌런 ${i + 1}</b><small>다음 핸드 ${POS_KO[villainPos(hp, i + 1)]}</small>${styleSel(v, 's-v' + i)}</div>`).join('')}</div>
    <div class="legend">${STYLE_KEYS.map(k => `<span><span class="dot" style="background:${STYLE_DOT[k]}"></span>${VILLAIN_STYLES[k].name}</span>`).join('')}</div>
    <p class="meta">성향은 빌런이 실제로 고르는 액션만 바꿔요. 채점과 EV는 항상 GTO 기준이에요. 바꾼 성향은 다음 핸드부터 적용돼요.</p>
    <button class="primary" id="s-save" type="button">저장하고 닫기</button>`, b => {
    b.querySelector('#s-x').onclick = closeSheet;
    b.querySelector('#s-all').onchange = e => { const v = e.target.value; if (!v) return; for (let i = 0; i < 8; i++) b.querySelector('#s-v' + i).value = v; };
    b.querySelector('#s-save').onclick = () => {
      if (A) { A.st = Array.from({ length: 8 }, (_, i) => b.querySelector('#s-v' + i).value); saveNow(); }
      closeSheet(); toast('저장했어요. 다음 핸드부터 적용돼요.');
    };
  });
}
$('b-set').onclick = () => { if (A) openSettings(); };

// ---------- 통계 ----------
function statsHtml() {
  const s = game ? game.stats : (savedStats || { hands: 0, net: 0, evLoss: 0, decisions: 0, postDecisions: 0, good: 0, preDecisions: 0, preMistakes: 0, preLoss: 0, history: [] });
  const per100 = x => s.hands ? sgn(x / s.hands * 100) : '–';
  const H = s.history || [];
  let chart = '<p class="meta">핸드를 치면 그래프가 생겨요.</p>';
  if (H.length > 1) {
    const W = 600, Ht = 200, pad = 34;
    const ys1 = H.map(h => h.net), ys2 = H.map(h => -h.evLoss);
    const minY = Math.min(0, ...ys1, ...ys2), maxY = Math.max(0, ...ys1, ...ys2), span = (maxY - minY) || 1;
    const X = i => pad + (i / (H.length - 1)) * (W - pad - 10), Y = v => 10 + (1 - (v - minY) / span) * (Ht - 30);
    const line = ys => ys.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    chart = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="누적 손익과 누적 EV 손실">
      <line x1="${pad}" x2="${W - 10}" y1="${Y(0)}" y2="${Y(0)}" stroke="#2A2F3B"/><text x="${pad - 6}" y="${Y(0) + 4}" text-anchor="end" font-size="11" fill="#A39C8E" font-family="monospace">0</text>
      <path d="${line(ys1)}" fill="none" stroke="#7FD4A0" stroke-width="2.5"/><path d="${line(ys2)}" fill="none" stroke="#D4AF7C" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="${W - 10}" y="${Ht - 4}" text-anchor="end" font-size="11" fill="#A39C8E" font-family="monospace">${H[H.length - 1].n}핸드</text></svg>
      <div class="legend"><span style="color:#7FD4A0">━ 누적 손익(BB)</span><span style="color:#D4AF7C">┅ 누적 EV 손실(−BB)</span></div>`;
  }
  const recent = H.slice(-10).reverse().map(h => `<div class="opt" style="grid-template-columns:42px minmax(0,1fr) 60px 60px"><span class="r meta">#${h.n}</span><span class="nm">${POS_KO[h.heroPos]} · ${h.cards.map(cardTxt).join('')}${h.board && h.board.length ? ' · ' + h.board.map(cardTxt).join('') : ''}</span><span class="r" style="color:${h.handNet >= 0 ? 'var(--good)' : 'var(--bad)'}">${sgn(h.handNet)}</span><span class="r">−${fmt(h.handLoss, 2)}</span></div>`).join('');
  return `<div class="sheethead"><div><h2>통계</h2><span class="meta">이번 판은 내 계정 기록, 그래프·최근 핸드는 이 기기 기록</span></div><button class="closebtn" id="x" type="button">닫기</button></div>
    <div class="statgrid">
      <div class="tile hl"><span>내 스택</span><b>${A ? fmt(A.s) : '–'}</b></div><div class="tile"><span>이번 판 핸드</span><b>${A ? A.h : 0}</b></div><div class="tile"><span>최고 스택</span><b>${A ? fmt(A.best) : '–'}</b></div>
      <div class="tile hl"><span>EV 손실 합</span><b>${A ? fmt(A.ev, 1) : '–'}</b></div><div class="tile hl"><span>EV 손실 /100핸드</span><b>${A && A.h ? fmt(A.ev / A.h * 100, 1) : '–'}</b></div><div class="tile"><span>GTO 일치율</span><b>${A && A.dn ? pct(A.good / A.dn) : '–'}</b></div>
      <div class="tile"><span>이 기기 핸드</span><b>${s.hands}</b></div><div class="tile"><span>손익 /100핸드</span><b>${per100(s.net)}</b></div><div class="tile"><span>프리플랍 실수</span><b>${s.preMistakes}/${s.preDecisions}</b></div></div>
    <div class="dec"><b>추이</b><div class="chart">${chart}</div></div>
    ${recent ? `<div class="dec"><b>최근 핸드</b><div class="opt hdr" style="grid-template-columns:42px minmax(0,1fr) 60px 60px"><span></span><span>핸드</span><span class="r">손익</span><span class="r">EV 손실</span></div>${recent}</div>` : ''}
    <p class="meta">손익은 카드 운이 섞여 있어요. 실력은 EV 손실(GTO 최선 액션 대비 잃은 기대값)로 봐요.</p>`;
}
$('b-stats').onclick = () => openSheet(statsHtml(), b => { b.querySelector('#x').onclick = closeSheet; });

// ---------- 시작 ----------
(async function init() {
  const g = $('gate');
  const gate = (h, p, btn, fn) => { $('main').hidden = true; g.hidden = false; g.className = 'gate'; g.innerHTML = `<h2>${h}</h2><p>${p}</p>${btn ? `<button class="primary" id="g-go" type="button">${btn}</button>` : ''}`; if (btn) $('g-go').onclick = fn; };
  gate('불러오는 중…', '내 스택을 확인하고 있어요.');
  let w = ST.who();
  for (let i = 0; i < 40 && !w.ok && w.wait; i++) { await io.wait(250); w = ST.who(); }
  if (!w.ok) { gate('참가하면 칠 수 있어요', '접속 코드와 닉네임으로 참가하면 내 계정에 스택이 저장돼요. 폰·PC 어디서 열어도 같은 스택으로 이어서 쳐요.', '참가하기', () => ST.join()); return; }
  if (!(await loadAcct())) { gate('스택을 불러오지 못했어요', '인터넷 연결을 확인하고 다시 열어 주세요.', '다시 시도', () => location.reload()); return; }
  if (A.s <= 0) showBust(); else showTable();
})();

</script>
</body>
</html>
