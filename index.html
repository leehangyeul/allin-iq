<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALLIN IQ · 홀덤 GTO 퀴즈</title>
<meta name="description" content="ALLIN IQ — 홀덤 GTO 퀴즈와 프리플랍 오픈 연습">
<meta name="theme-color" content="#07090F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALLIN IQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* layout: one phone column — top bar, street pills, oval 9-seat table stage, action sheet below. Single dark card-room look in every theme. */
:root{
  --room:#070B12; --sheet:#0B111B; --sheet2:#0A0F18; --line:#1A2536; --line2:#2A3648;
  --fg:#EAF1FA; --muted:#8FA3BC; --dim:#5E708A;
  --rail:#0E1520; --rail2:#1E2A3B; --felt:#12355E; --felt2:#1A4A80; --feltline:#24507F;
  --gold:#F2B544; --gold-soft:#2A1F08; --gold-ink:#F7D488;
  --hero:#5AA9FF; --hero-soft:#0F2238; --hero-ink:#A9D1FF;
  --vil:#FF6B5E; --vil-soft:#2A1218; --vil-ink:#FFB0A8;
  --good:#5DBB7E; --good-ink:#8FD3A6; --good-soft:#132A1D;
  --bad:#E4705E; --bad-ink:#F3A08A; --bad-soft:#33170F;
  --card:#FFFFFF; --red:#D3263A; --black:#1B1D22;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --num:"Barlow Condensed","IBM Plex Mono",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--room);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 28px}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--hero);outline-offset:2px}
.app{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:13px}
/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.iconb{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--sheet);color:var(--muted);display:flex;align-items:center;justify-content:center}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.tt b{font-size:15px;font-weight:700}
.tt span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp{flex:none;font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:999px;background:#1C2A40;color:var(--hero)}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.prog:empty{display:none}
.prog div{font-size:11px;text-align:center;padding:4px 2px;border-radius:6px;background:#111A27;color:#56677E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .done{background:#131C2A;color:var(--muted)}
.prog .now{background:var(--gold);color:#241A06;font-weight:700}
/* table stage */
.tbl{position:relative;width:100%;aspect-ratio:390/580}
.rail{position:absolute;border-radius:50%;background:var(--rail);box-shadow:inset 0 0 0 2px var(--rail2)}
.felt{position:absolute;inset:12px;border-radius:50%;background:var(--felt);box-shadow:inset 0 0 0 2px var(--felt2)}
.fline{position:absolute;inset:26px;border-radius:50%;border:1px dashed var(--feltline)}
.seat{position:absolute;transform:translate(-50%,-30%);display:flex;flex-direction:column;align-items:center;gap:2px;width:60px}
.seat .sc{width:44px;height:44px;border-radius:50%;background:#121A26;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#8FA3BC}
.seat .fd{font-size:10px;color:var(--dim)}
.seat.vil{width:72px;transform:translate(-50%,-32%)}
.seat.vil .sc{width:50px;height:50px;background:var(--vil-soft);border:3px solid var(--vil);color:var(--vil-ink);font-weight:600;font-size:12px}
.tagv{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--vil);color:#2A1405}
.stv{font-family:var(--mono);font-size:12px;color:var(--vil-ink)}
.bub{position:absolute;transform:translate(-50%,-50%);padding:5px 10px;border-radius:10px;background:var(--vil);color:#2A1405;font-size:12px;font-weight:700;white-space:nowrap;z-index:2}
.bub.chk{background:#2A1B10;border:1.5px solid var(--vil);color:var(--vil-ink)}
.chip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13px;color:var(--gold-ink);white-space:nowrap}
.chip i{width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px #B9862A}
.dealer{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--gold-ink);color:#3A2A08;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pot{position:absolute;transform:translate(-50%,-50%);padding:4px 12px;border-radius:999px;background:#0B2240;font-family:var(--mono);font-size:13px;color:var(--gold-ink);white-space:nowrap}
.board{position:absolute;transform:translate(-50%,-50%);display:flex;gap:5px}
.pc.new{box-shadow:0 0 0 2px var(--gold)}
.hole{position:absolute;transform:translate(-50%,-50%);display:flex;gap:6px}
.hplate{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:14px;background:var(--hero-soft);border:2px solid var(--hero);white-space:nowrap}
.tagh{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--hero);color:#0B1D33}
.sth{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--hero-ink)}
.sth small,.sv small{font-size:12px;margin-left:2px}
@media (prefers-reduced-motion:no-preference){.pc.new{animation:deal .35s ease-out}@keyframes deal{from{transform:translateY(-10px);opacity:.3}to{transform:none;opacity:1}}}
/* band (results, menu) */
.band{border-radius:999px;background:var(--rail);padding:10px;box-shadow:inset 0 0 0 2px var(--rail2)}
.bfelt{border-radius:999px;background:var(--felt);padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.bb{display:flex;gap:5px}
.bline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px}
.mini2{display:flex;gap:3px}
.hs2{color:var(--hero-ink)}.vs2{color:var(--vil-ink)}
.hs2 b,.vs2 b{font-family:var(--mono);font-size:15px}
.avg{font-family:var(--mono);font-size:48px;line-height:1;color:var(--gold-ink)}
/* sheet */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.alh{display:flex;align-items:baseline;justify-content:space-between}
.qbox{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:#14120E;border:1px solid #5A4B32}
.coachtile{grid-column:1/-1;min-height:0!important;flex-direction:row!important;align-items:center!important;flex-wrap:wrap;background:#0F1626;border:1px dashed #3A4766!important;color:var(--fg)}
.coachtile.on{background:linear-gradient(160deg,#1B2640,#121A29);border:1px solid #D4AF7C!important}
.coachtile .ts2{flex:1 1 140px;font-size:12px;color:var(--muted);line-height:1.5}
.coachtile .tgo{align-self:center!important;flex:none;padding:0 14px;background:rgba(212,175,124,.16);color:#F0D7AE}
.coc{border-radius:18px;background:#121A29;border:1px solid #263048;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.coc small{font-size:12px;color:var(--muted);font-weight:700}
.coc.sum{background:linear-gradient(160deg,#1B2640,#121A29);border-color:#D4AF7C}.coc.sum>b{font-size:18px;line-height:1.5}
.coc.weak{background:#1A1210;border-color:#5A3A2E}.coc.weak small{color:#F2B5A4}
.coc.strong{background:#10261B;border-color:#1B4A33}.coc.strong small{color:#7FD4A6}
.coc.lock{border-style:dashed}
.cohd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.cohd>div{display:flex;flex-direction:column;gap:2px;min-width:0}.cohd b{font-size:17px;line-height:1.4;word-break:keep-all}
.cosc{font-family:var(--mono);font-style:normal;font-size:26px;font-weight:700;color:#FF8A78}.coc.strong .cosc{color:#A7EBC6}
.cob{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12px;color:#CFC7B5}
.cob i{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;display:block}.cob u{display:block;height:100%;background:#E5604D}
.coc.strong .cob u{background:#5FC892}.coc.sum .cob u,.coc.lock .cob u{background:#D4AF7C}
.cob b{font-family:var(--mono);text-align:right;font-weight:600}
.cosub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cobg{padding:3px 10px;border-radius:999px;font-weight:700;border:1px solid #3A4766;color:#F0D7AE;background:#1B2640}.cobg.up{background:#10261B;color:#A7EBC6;border-color:#1B4A33}.cobg.down{background:#2A1B16;color:#F2B5A4;border-color:#5A3A2E}
.cowhy{margin:0;font-size:13px;line-height:1.7;color:#E6E1D6}
.cot2{border-radius:12px;background:rgba(0,0,0,.25);padding:12px 14px;display:flex;flex-direction:column;gap:6px}.cot2 b{font-size:13px;color:#F0D7AE}.cot2 span{font-size:13px;line-height:1.6;color:#E6E1D6}
.cot2 ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.6;color:#E6E1D6}



/* 시작 화면 (D안): 점수 링 + 큰 버튼 + 하단 메뉴 */
.hmw{display:flex;flex-direction:column;gap:16px}
.hmn{display:flex;align-items:center;justify-content:flex-end;min-height:32px;font-size:14px;color:#E6E9F0}
.hmring{display:flex;flex-direction:column;align-items:center;gap:6px}
.hmring .rw{position:relative;width:196px;height:196px}.hmring svg{display:block}
.hmring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.hmring .rl{font-size:12px;color:#A9B2C3}.hmring .rv{font-family:var(--num);font-size:60px;font-weight:700;line-height:1;color:#F0D7AE}.hmring .rv.m{font-size:26px;font-family:inherit;font-weight:800}
.hmring .rs{font-size:13px;color:#A9B2C3}.hmring .rs b{color:#F0D7AE}
.hmcta{border:0;border-radius:18px;min-height:80px;padding:12px 18px;background:linear-gradient(160deg,#F0D7AE,#C79E66 60%,#A9824E);color:#1A1306;display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%}
.hmcta .t{display:flex;flex-direction:column;gap:2px}.hmcta b{font-size:20px;font-weight:800}.hmcta small{font-size:13px;font-weight:500;opacity:.8}
.hmsub{border-radius:18px;min-height:68px;padding:10px 18px;background:#101A2E;border:1px solid rgba(212,175,124,.5);color:#F8F9FB;display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%}
.hmsub .t{display:flex;flex-direction:column;gap:2px}.hmsub b{font-size:17px}.hmsub small{font-size:12px;color:#A9B2C3}
.hmst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:16px;background:#0F1729;padding:12px 0}
.hmst div{display:flex;flex-direction:column;align-items:center;gap:2px}.hmst div+div{border-left:1px solid #1E2940}
.hmst b{font-family:var(--num);font-size:22px;color:#F0D7AE}.hmst span{font-size:12px;color:#A9B2C3}
.mnavsp{height:84px}
.mnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,420px);box-sizing:border-box;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));background:#0A0F1B;box-shadow:0 -1px 0 #1E2940}
@media (min-width:600px){.mnav{width:min(100%,560px)}}
.mnav button{border:0;background:transparent;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#A9B2C3;font-size:12px}
.mnav button.on{color:#F0D7AE;font-weight:700}
.mmore{display:flex;flex-direction:column;gap:10px}
.mrow2{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 16px;border-radius:14px;background:#0F1729;border:0;color:#F8F9FB;font-size:15px;text-align:left;width:100%}
.mrow2 i{font-style:normal;color:#D4AF7C;font-size:18px}
/* 결과 카드 (F안) */
.rcnav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 2fr;gap:6px;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(7,9,15,0),#07090F 28%)}
.rcnav .ghost,.rcnav .cta{min-height:54px;width:auto}
.rcbars{grid-column:1/-1;width:100%;box-sizing:border-box;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;padding:0}
.rcbars button{height:16px;border:0;padding:6px 0;background:transparent}
.rcbars i{display:block;height:4px;border-radius:2px;background:#2A2F3B}.rcbars i.on{background:#D4AF7C}
.rcpg{display:flex;flex-direction:column;gap:14px}
.rclab{font-size:13px;font-weight:700;letter-spacing:.1em;color:#D4AF7C}
.rchead{margin:0;font-size:22px;font-weight:800;line-height:1.45;word-break:keep-all}.rchead em{font-style:normal;color:#EAD3AE}
.rcrows{display:flex;flex-direction:column;gap:8px}
.rcrow{display:grid;grid-template-columns:64px minmax(0,1fr) 40px 14px;gap:10px;align-items:center;min-height:52px;padding:0 12px;border-radius:12px;border:1px solid #1A1F2B;background:#0C1019;color:inherit;font-family:inherit;text-align:left;width:100%}
.rcrow.bd{border-color:rgba(217,138,115,.45)}
.rcrow .rn{font-size:14px;color:#A39C8E}.rcrow .rm{font-size:15px}.rcrow .rm b.a{color:#F0B9A6}.rcrow .rm b.z{color:#F6E4C4}.rcrow .rm s{text-decoration:none;color:#6E6A62}
.rcrow .rs{font-size:18px;font-weight:700;text-align:right;color:#EAD3AE}.rcrow.bd .rs{color:#F0B9A6}
.rcname{font-size:30px;font-weight:800;line-height:1.1}
.rcvil{align-self:flex-start;padding:8px 14px;border-radius:14px;background:#24140F;box-shadow:inset 0 0 0 1px rgba(217,138,115,.5);font-size:14px;line-height:1.5;color:#F0B9A6}
.rctbl{border-radius:18px;padding:14px;background:radial-gradient(ellipse at 50% 30%,#25211A 0%,#17140F 60%,#0B0A08 100%);box-shadow:inset 0 0 0 1px rgba(212,175,124,.45);display:flex;flex-direction:column;gap:12px}
.rctbl .t{font-size:12px;font-weight:700;letter-spacing:.06em;color:#A39C8E}
.rctbl .cr{display:flex;gap:6px}
.rctbl .hr{display:flex;align-items:center;gap:12px}.rctbl .hr.l{padding-top:12px;border-top:1px solid rgba(212,175,124,.25)}
.rctbl .hi{display:flex;flex-direction:column;gap:2px;font-size:13px;color:#A39C8E}.rctbl .hi b{font-size:15px;color:#F8F9FB}
.rcpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rcpick>div{padding:7px 10px;border-radius:10px;background:#12151C;box-shadow:inset 0 0 0 1px #D98A73}
.rcpick>div.g{background:#231D13;box-shadow:inset 0 0 0 1px #D4AF7C}.rcpick>div.ok{box-shadow:inset 0 0 0 1px #D4AF7C}
.rcpick small{display:block;font-size:11px;color:#A39C8E}.rcpick>div.g small{color:#D4AF7C}
.rcpick b{font-size:18px;line-height:1.3;color:#F0B9A6}.rcpick>div.g b{color:#F6E4C4}.rcpick>div.ok b{color:#F6E4C4}
.rcpick span{font-size:12px;font-weight:700;margin-left:6px;color:#F0B9A6}.rcpick>div.g span{color:#D4AF7C}
.rcwhy{margin:0;font-size:18px;font-weight:500;line-height:1.6;word-break:keep-all}
.rcsecs{display:flex;flex-direction:column;gap:8px}.rcsecs>span.h{font-size:13px;font-weight:700;color:#A39C8E}
.rcsec{border-radius:14px;background:#0C1019;border:1px solid #1A1F2B}.rcsec.open{border-color:rgba(212,175,124,.45)}
.rcsec>button{width:100%;min-height:56px;border:0;background:transparent;color:inherit;font-family:inherit;display:grid;grid-template-columns:minmax(0,1fr) 20px;gap:10px;align-items:center;padding:8px 14px;text-align:left}
.rcsec>button b{display:block;font-size:15px}.rcsec>button small{display:block;font-size:13px;color:#A39C8E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcsec>button em{font-style:normal;font-size:20px;color:#D4AF7C;text-align:center}
.rcbody{padding:2px 14px 16px;display:flex;flex-direction:column;gap:10px}
.rcbody .rxload{margin:0;font-size:13px;color:#A39C8E}
.rcnote{font-size:12px;line-height:1.5;color:#A39C8E}
.rcrs{border-radius:14px;padding:14px;background:#12161F;border:1px solid rgba(212,175,124,.35);display:flex;flex-direction:column;gap:10px}
.rcrs>b{font-size:16px;color:#EAD3AE}.rcrl{margin:0;font-size:15px;line-height:1.6;word-break:keep-all}.rcrl b{color:#F6E4C4}
.rcrs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rcrs li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding-top:8px;border-top:1px solid #1E2635;font-size:14px;line-height:1.55}
.rcrs li>span{font-size:12px;color:#A39C8E;padding-top:2px}.rcrs li b{font-weight:700}.rcrs li em{display:block;font-style:normal;font-size:13px;color:#A39C8E}
.rcrs li b.good{color:#7FD8A0}.rcrs li b.bad{color:#F29A8E}.rcrs li b.mid{color:#EAD3AE}
.rcrn{margin:0;font-size:12px;color:#A39C8E}
/* 코치 상세 분석 */
.cdgo{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border-radius:14px;border:1px solid #D4AF7C;background:#1B2640;color:var(--fg);padding:13px 16px;margin-bottom:12px}
.cdgo b{display:block;font-size:15px;color:var(--gold-ink)}.cdgo small{display:block;font-size:12px;color:var(--muted);margin-top:2px}.cdgo i{font-style:normal;font-size:22px;color:var(--gold)}
.cdtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cdtile{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;min-width:0}.cdtile b{display:block;font-family:var(--mono);font-size:24px;line-height:1.2;color:var(--gold-ink)}.cdtile span{font-size:12px;color:var(--muted)}
.cdsr{display:flex;flex-direction:column;gap:8px}
.cdsrow{display:grid;grid-template-columns:48px minmax(0,1fr) 16px;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:rgba(0,0,0,.2);font-size:13.5px;line-height:1.45;color:var(--fg)}
.cdsrow .cdk{font-size:11.5px;font-weight:700;text-align:center;border-radius:6px;padding:2px 0;background:#1C2A40;color:var(--muted)}
.cdsrow .cdk-g{background:#5AA9FF;color:#06121F}.cdsrow .cdk-b{background:var(--bad);color:#2A0E08}.cdsrow .cdk-y{background:var(--gold);color:#241A06}
.cdsrow .cdgoo{color:var(--muted);font-size:18px;text-align:right}
.cdh2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px}.cdh2>b{font-size:16px}
.cdbtn{font-size:13px;font-weight:700;color:var(--gold-ink);border:1px solid var(--gold);border-radius:8px;background:transparent;padding:5px 12px}
.cdsecs{display:flex;flex-direction:column;gap:10px}
.cdsec{border-radius:16px;background:#121A29;border:1px solid #263048;min-width:0}

/* ===== responsive policy (project tiers, CSS px of the live viewport; never device names) =====
   tiny <360 · compact 360–389 · standard 390–429 · large 430–599 · medium 600–839 · expanded ≥840 */
:root{--gut:16px;--gap:8px;--tblr:250px}
body{font-size:16px;min-height:100vh;min-height:100dvh;
  padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
@media (max-width:319px){:root{--gut:12px}}
@media (min-width:430px){:root{--gut:20px}}
@media (min-width:600px){:root{--gut:24px}.app{max-width:560px}}
@media (min-width:840px){:root{--gut:32px;--gap:12px}}
@media (max-height:479px){:root{--gap:6px}body{padding-top:max(6px,env(safe-area-inset-top,0px))}}
.app{gap:var(--gap);min-width:0}.app>*{min-width:0}
/* touch targets: 48 CSS px minimum */
.top{min-height:48px}.iconb{width:48px;height:48px}
.lnk,.adb,.sm2b,.cta.sm2b,.tabs2 button{min-height:48px}
.tabs2 button{padding:0 12px;font-size:13px}
/* readable secondary text */
#panel p,#panel label,#panel li,.sec{word-break:keep-all;overflow-wrap:anywhere}.svd{white-space:nowrap}
.tt b{font-size:16px}.tt span{font-size:13px}
.lbs{font-size:13px}.lbw{font-size:14px}.mode p{font-size:14px}.mstat{font-size:13px}.sec{font-size:14px}.who2{font-size:15px}
/* the table never pushes the decision off a short phone: width follows the window height */
#stage .tbl{margin-inline:auto;max-width:max(250px,calc((100vh - var(--tblr)) * .6724))}
@supports (height:100dvh){#stage .tbl{max-width:max(250px,calc((100dvh - var(--tblr)) * .6724))}}
@media (max-width:359px){.btns.n4{grid-template-columns:repeat(2,minmax(0,1fr))}.btns .bm{font-size:15px}.btns .b{padding-inline:2px}}
/* decision buttons stay reachable at the bottom edge of short phones */
#panel .btns{position:sticky;bottom:0;z-index:3;background:var(--sheet);margin-inline:-14px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 16px -10px rgba(0,0,0,.7)}
/* two panes: wide windows, and phones turned sideways (table left, decisions right) */
@media (min-width:840px) and (min-height:480px),(min-width:600px) and (max-height:479px){
  :root{--tblr:130px}
  .app:has(#stage .tbl){max-width:1120px;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,38vw,420px);
    grid-template-areas:"top top" "prog prog" "stage panel" "disc panel";column-gap:24px;align-items:start}
  .app:has(#stage .tbl)>#top{grid-area:top}.app:has(#stage .tbl)>#prog{grid-area:prog}
  .app:has(#stage .tbl)>#stage{grid-area:stage;position:sticky;top:max(8px,env(safe-area-inset-top,0px))}
  .app:has(#stage .tbl)>#panel{grid-area:panel}.app:has(#stage .tbl)>.disc{grid-area:disc}
}

function rank5(cs){

  const cnt={};r.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g=Object.entries(cnt).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const kick=g.map(x=>x[1]);
  if(st>=0&&fl)return[8,st];
  if(g[0][0]===4)return[7,...kick];
  if(g[0][0]===3&&g[1][0]===2)return[6,...kick];
  if(fl)return[5,...r];
  if(st>=0)return[4,st];
  if(g[0][0]===3)return[3,...kick];

  const hit=(r,list)=>list.reduce((o,q)=>{const w=Math.min(r.right,q.right)-Math.max(r.left,q.left),h=Math.min(r.bottom,q.bottom)-Math.max(r.top,q.top);return o+(w>0&&h>0?w*h:0)},0);

// ================= 프리플랍 오픈 연습 (MTT9 v0.6 자료) =================
// 15·25·40·75BB: 프리플랍 강의 교재 차트(학습용 분류, 혼합 빈도 아님) → "차트와 일치" 연습으로만 채점.
// 10BB: 앱과 같은 조건으로 직접 계산한 푸시/폴드 근사(첫 콜러 모델) → 빈도와 EV로 채점.
const DPOS=["UTG","UTG+1","UTG+2","LJ","HJ","CO","BTN","SB","BB"];
const DRK="AKQJT98765432";
const DH=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++)DH.push(i===j?DRK[i]+DRK[i]:(i<j?DRK[i]+DRK[j]+"s":DRK[j]+DRK[i]+"o"));
const dComb=h=>h.length===2?6:(h[2]==="s"?4:12);
const DACT={f:"폴드",l:"림프",c:"콜",r:"오픈",j:"올인"};
const DCOL={f:"#1A2536",l:"#3E9E5F",c:"#3A7FC4",r:"#D9A13B",j:"#D9534A"};
const DORDER="flcrj";
let DS=null; // current drill question
function dLoad(){try{return JSON.parse(localStorage.getItem("hgq-drill")||"null")||{n:0,sum:0,streak:0,best:0}}catch(e){return{n:0,sum:0,streak:0,best:0}}}
function dSave(){try{localStorage.setItem("hgq-drill",JSON.stringify(DSTATS))}catch(e){}}
let DSTATS=dLoad();

function dActLabel(sp,l){
  if(l==="r"){if(sp.spot==="vs_open")return"3벳";if(sp.pos==="SB")return"레이즈 3.5BB";return sp.st>=40?"오픈 2.2BB":"오픈 2BB"}
  return DACT[l];
}
function dPick(arr){return arr[Math.floor(Math.random()*arr.length)]}
// spots: chart RFI (7 positions x 4 stacks), SB first-in (4), BB vs BTN 40BB, 10BB jam (8), 10BB facing a jam (36)
function dSpot(){
  const u=Math.random();
  if(u<0.50){const c=dPick(DRILL_CHARTS.filter(c=>c.spot==="rfi"&&c.pos!=="SB"));return{kind:"chart",...c}}
  if(u<0.62){const c=dPick(DRILL_CHARTS.filter(c=>c.spot==="rfi"&&c.pos==="SB"));return{kind:"chart",...c}}
  if(u<0.70){const c=DRILL_CHARTS.find(c=>c.spot==="vs_open");return{kind:"chart",...c}}
  if(u<0.88){const p=dPick(DPOS.slice(0,8));return{kind:"pf10",st:10,pos:p,spot:"rfi"}}
  const k=dPick(Object.keys(DRILL_PF10.call));const [op,pos]=k.split(">");return{kind:"pf10",st:10,pos,op,spot:"vs_shove"}
}
// what each hand class does in this spot: letter for charts, frequency of the aggressive action for 10BB
function dGrid(sp){
  if(sp.kind==="chart")return sp.g.split("");
  const f=sp.spot==="rfi"?DRILL_PF10.jam[sp.pos]:DRILL_PF10.call[sp.op+">"+sp.pos];
  return f.map(x=>x>=0.5?(sp.spot==="rfi"?"j":"c"):"f");
}

function diffRoll(){let u=Math.random();for(const [t,p] of DIFF_MIX){if(u<p)return t;u-=p}return 2}

const D_TIERS={};

const COACH_MIN=50,COACH_KEEP=150,COACH_SAMP=5;

function coachHand(h,sc){CL.hn++;const hi=CL.hn,u=Date.now()+"."+coachDev();

// ---- the coach record follows the player to every device: it is stored in coach/{uid} and merged by a unique hand id (u) ----
// a hand = all its decision records sharing one u. Two devices union their hands, so nothing is counted twice, then number them again in time order.
function coachDev(){let d=lsGet("hgq-dev");if(!d){d=Math.random().toString(36).slice(2,8);lsSet("hgq-dev",d)}return d}
const COACH_T0=Date.UTC(2026,9,22,9,13); // records made before syncing existed get an id dated from the day the coach board shipped
const CS={snap:undefined,kick:false,fail:false,busy:false,again:false,pt:null};
function coachStamp(){const dev=coachDev();let ch=false;

  if(ch)coachSave()}
const coachKey=u=>{const a=String(u).split(".");return[+a[0]||0,a[1]||""]};
function coachGroups(arr){const m=new Map();(arr||[]).forEach(r=>{const u=r.u||("x"+r.i);if(!m.has(u))m.set(u,[]);m.get(u).push(r)});return m}

const coachSig=o=>[o.hn,o.dn,(o.h||[]).map(r=>r.u+"/"+r.s).join(","),(o.d||[]).map(r=>r.u).join(",")].join("|");
// the saved record counts only if it is from this season and newer than this player's last reset

const COACH_GRP={UTG:"EP","UTG+1":"EP","UTG+2":"EP",MP:"EP",LJ:"MP",HJ:"MP",CO:"LP",BTN:"LP",SB:"BL",BB:"BL"};

function coachAgg(rs){if(!rs.length)return{n:0,avg:0};return{n:rs.length,avg:rs.reduce((a,r)=>a+r.sc,0)/rs.length}}
function coachWin(g,lo,hi){return CL[g].filter(r=>r.i>lo&&r.i<=hi)}
function coachInfo(){
  const nh=CL.hn,nd=CL.dn,ready=nh>=COACH_MIN&&nd>=COACH_MIN;
  const out={nh,nd,ready,weak:[],strong:[]};if(!ready)return out;
  const cur={h:coachWin("h",nh-COACH_MIN,nh),d:coachWin("d",nd-COACH_MIN,nd)};
  const prev={h:coachWin("h",nh-2*COACH_MIN,nh-COACH_MIN),d:coachWin("d",nd-2*COACH_MIN,nd-COACH_MIN)};
  const tot={h:coachAgg(cur.h),d:coachAgg(cur.d)};
  out.tot=tot;out.timeouts=cur.h.filter(r=>r.to).length;
  const rows=[];
  COACH_CATS.forEach(c=>{
    const a={h:coachAgg(cur.h.filter(c.f)),d:coachAgg(cur.d.filter(c.f))};
    const pa={h:coachAgg(prev.h.filter(c.f)),d:coachAgg(prev.d.filter(c.f))};
    const both=c.only!=="h"&&a.h.n>=COACH_SAMP&&a.d.n>=COACH_SAMP;
    const gh=a.h.n>=COACH_SAMP?tot.h.avg-a.h.avg:null,gd=a.d.n>=COACH_SAMP?tot.d.avg-a.d.avg:null;
    const ns=(c.only==="h"?a.h.n:a.h.n+a.d.n);
    const avg=c.only==="h"?a.h.avg:(a.h.n+a.d.n?(a.h.avg*a.h.n+a.d.avg*a.d.n)/(a.h.n+a.d.n):0);
    const pn=c.only==="h"?pa.h.n:pa.h.n+pa.d.n;
    const pavg=pn?(c.only==="h"?pa.h.avg:(pa.h.avg*pa.h.n+pa.d.avg*pa.d.n)/pn):0;
    const delta=pn>=COACH_SAMP&&ns>=COACH_SAMP?avg-pavg:null;
    let gap=null,scope=null;
    if(both){gap=(gh+gd)/2;scope=(gh>=3&&gd>=3)?"both":(gh<=-3&&gd<=-3)?"both":"mixed"}
    else if(c.only==="h"&&gh!=null){gap=gh;scope="h"}
    else if(gh!=null&&gd==null&&a.h.n>=8){gap=gh;scope="h"}
    else if(gd!=null&&gh==null&&a.d.n>=8){gap=gd;scope="d"}
    if(gap==null)return;
    rows.push({id:c.id,l:c.l,a,avg,delta,gap,scope,gh,gd,only:c.only});
  });
  const st=d=>d==null?"base":d>=5?"up":d<=-5?"down":"same";
  rows.forEach(r=>r.status=st(r.delta));
  out.weak=rows.filter(r=>r.gap>=4&&r.avg<75&&r.scope!=="mixed").sort((x,y)=>{const bx=x.scope==="both"?1:0,by=y.scope==="both"?1:0;return by-bx||y.gap-x.gap}).slice(0,3);
  out.strong=rows.filter(r=>r.gap<=-4&&r.avg>=75&&r.scope!=="mixed").sort((x,y)=>{const bx=x.scope==="both"?1:0,by=y.scope==="both"?1:0;return by-bx||x.gap-y.gap}).slice(0,2);
  return out;
}

function coachBars(r){const g=[["h","핸드 퀴즈"],["d","오픈 연습"]].filter(([k])=>r.a[k].n>0&&!(r.only==="h"&&k==="d"));

 "프리플랍":"시작 핸드 선택이 모든 단계의 기반이에요. 포지션별 오픈 범위부터 다시 확인해요.",

 "블라인드":"블라인드에서는 포지션 불리를 감안해 플랍 이후 신중하게 가요.",

 "중간 포지션":"중간 포지션은 앞 포지션보다 조금 넓히되 일관되게 가요.",
 "뒤 포지션":"뒤 포지션의 이점을 살려 넓게 열고 플랍 이후 주도권을 활용해요.",

 "강한 핸드":"강한 핸드는 대부분 계속하되, 3벳 앞에서는 어디까지 갈지 미리 정해 둬요.",
 "중간 핸드":"중간 핸드는 경계선이라 자리와 가격에 따라 답이 갈려요. 포지션이 좋고 가격이 싸면 계속하고, 아니면 정리하는 기준을 연습해요.",
 "약한 핸드":"약한 핸드는 포지션이 좋고 가격이 맞을 때만 계속해요. 앞 포지션에서는 대부분 접어요.",
 "아주 약한 핸드":"아주 약한 핸드는 접는 게 기본이에요. 블라인드에서 가격이 싸도 계속하는 핸드는 일부뿐이에요.",
 "10~15BB":"10~15BB는 올인 아니면 폴드로 단순해요. 올인 범위 표를 외우는 게 가장 빨라요.",
 "20~25BB":"20~25BB는 레이즈 후 접기가 어려워요. 올인이나 폴드 위주로 단순하게 가는 구간을 연습해요.",
 "30~40BB":"30~40BB는 3벳 올인과 콜의 경계가 중요해요. 스택이 짧아질수록 올인 범위가 넓어지는 흐름을 익혀요.",
 "60~100BB":"깊은 스택에서는 포지션과 핸드의 잠재력을 함께 봐요."

function cdRows(R,ALL){
  const GN={EP:"앞 포지션",MP:"중간 포지션",LP:"뒤 포지션",BL:"블라인드"},GS={EP:"UTG~MP",MP:"LJ·HJ",LP:"CO·BTN",BL:"SB·BB"};
  const STR=["프리플랍","플랍","턴","리버"];
  const stk=b=>b<=15?"10~15BB":b<=25?"20~25BB":b<=40?"30~40BB":"60~100BB";
  const D=[
   {id:"sit",name:"상황",short:"상황",key:r=>r.sit?CD_SIT[r.sit]:null,order:Object.values(CD_SIT)},
   {id:"st",name:"스트리트",short:"스트리트",key:r=>STR[r.s],order:STR,tip:"street"},
   {id:"pos",name:"포지션",short:"포지션",key:r=>GN[COACH_GRP[r.p]],sub:v=>GS[Object.keys(GN).find(k=>GN[k]===v)],order:Object.values(GN),tip:"pos"},
   {id:"stk",name:"스택 깊이",short:"스택",key:r=>stk(r.st),order:["10~15BB","20~25BB","30~40BB","60~100BB"],tip:"stack"},
   {id:"tier",name:"내 핸드 강도 (프리플랍)",short:"핸드 강도",key:r=>r.t?CD_TIER[r.t]:null,order:Object.values(CD_TIER),tip:"hs"}];
  const rows=[];
  D.forEach(d=>{const m={};R.forEach(r=>{const k=d.key(r);if(k==null)return;(m[k]=m[k]||[]).push(r)});
    d.order.forEach(k=>{const a=m[k];if(!a)return;rows.push({dim:d.name,did:d.id,short:d.short,v:k,n:a.length,avg:cdAvg(a.map(r=>r.sc)),loss:a.reduce((s,r)=>s+100-r.sc,0),sub:d.sub?d.sub(k):""})})});
  rows.forEach(r=>{r.diff=r.avg-ALL;r.ok=r.n>=8});
  return{rows,D,GN,GS,STR}}
const CD_SITK={"오픈":"open","블라인드 방어":"bdef","포지션 방어":"pdef","3벳 대응":"vs3b","멀티웨이":"mw","푸시·폴드":"pf"};
function cdBuild(R){
  const N=R.length,ALL=cdAvg(R.map(r=>r.sc));

  const ok=rows.filter(r=>r.ok);
  const strong=[...ok].sort((a,b)=>b.diff-a.diff).filter(r=>r.diff>=5).slice(0,3);
  const weak=[...ok].sort((a,b)=>a.diff-b.diff).filter(r=>r.diff<=-5).slice(0,3);
  const perfect=R.filter(r=>r.sc===100).length,zero=R.filter(r=>r.sc===0).length;
  const B=Math.min(50,Math.floor(N/2));
  const first=cdAvg(R.slice(0,B).map(r=>r.sc)),last=cdAvg(R.slice(-B).map(r=>r.sc));
  const totLoss=R.reduce((s,r)=>s+100-r.sc,0)||1;
  const lossTop=rows.filter(r=>r.did==="sit").sort((a,b)=>b.loss-a.loss)[0]||{v:"-",loss:0};
  const NM4=["폴드","콜·체크","베팅·레이즈","올인"];
  const me4=[0,0,0,0],ref4=[0,0,0,0];R.forEach(r=>{me4["FPAJ".indexOf(r.k)]++;r.g.forEach((v,i)=>ref4[i]+=v/100)});
  const mp=me4.map(v=>v/N*100),rp=ref4.map(v=>v/N*100);
  const dd=NM4.map((n,i)=>({n,d:mp[i]-rp[i]})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))[0];
  const mixLine=Math.abs(dd.d)<4?"행동 비율이 GTO와 비슷해요":`‘${dd.n}’을 GTO보다 ${cdF(Math.abs(dd.d))}%p ${dd.d>0?"많이":"적게"} 골라요`;
  const ev=R.filter(r=>r.ev!=null),evLoss=ev.reduce((s,r)=>s+r.ev,0),evBad=ev.filter(r=>r.ev>0);
  const evm={};ev.forEach(r=>{const k=r.hc+"|"+r.p;(evm[k]=evm[k]||{hc:r.hc,p:r.p,n:0,l:0,fold:0,loose:0})});
  ev.forEach(r=>{const e=evm[r.hc+"|"+r.p];e.n++;e.l+=r.ev;if(r.ev>0){r.k==="F"?e.fold++:e.loose++}});

  const hands=new Set(R.map(r=>r.u)).size;
  let h="";

   <div class="cdtiles">${[[cdF(ALL),cdT("score","평균 점수")],[Math.round(perfect/N*100)+"%",cdT("match","GTO 일치율")],[zero+"개",cdT("big","큰 실수")],[cdS(last-first),`처음 ${B}개 → 최근 ${B}개`]].map(t=>`<div class="cdtile"><b>${t[0]}</b><span>${t[1]}</span></div>`).join("")}</div>
   <div class="cdsr">${[
    ["강점","g",strong[0]?`${esc(strong[0].v)} ${cdF(strong[0].avg)}점 (${cdS(strong[0].diff)})`:"뚜렷한 강점이 아직 없어요","cd-sw"],
    ["약점","b",weak[0]?`${esc(weak[0].v)} ${cdF(weak[0].avg)}점 (${cdS(weak[0].diff)})`:"뚜렷한 약점이 아직 없어요","cd-sw"],
    ["손실","",`잃은 점수의 ${Math.round(lossTop.loss/totLoss*100)}%가 ‘${esc(lossTop.v)}’ 상황에서 나왔어요`,"cd-loss"],
    ["습관","",esc(mixLine),"cd-mix"],
    ["EV","",ev.length?`푸시·폴드에서 ${cdF(evLoss)}BB 손해 (${evBad.length}번)`:"푸시·폴드 기록이 아직 없어요","cd-ev"],
    ["연습","y",picked[0]?`‘${esc(picked[0].v)}’부터 (예상 +${picked[0].gain.toFixed(1)}점)`:"어려움 난이도에 도전해 보세요","cd-rx"]
   ].map(r=>`<button class="cdsrow" type="button" data-cdgo="${r[3]}"><span class="cdk cdk-${r[1]}">${r[0]}</span><span>${r[2]}</span><span class="cdgoo">›</span></button>`).join("")}</div></div>`;
  h+=`<div class="cdh2"><b>자세히 보기</b><button class="cdbtn" id="cdall" type="button">모두 펼치기</button></div>`;
  const sec=(id,title,sum,body)=>`<details class="cdsec" id="${id}"><summary><div><b>${title}</b><span>${sum}</span></div><i class="cdchev"></i></summary><div class="cdbody">${body}</div></details>`;
  // ---- 추이
  let trend;{
    const nb=Math.max(2,Math.floor(N/50)),size=Math.floor(N/nb);const bl=[];
    for(let i=0;i<nb;i++){const a=R.slice(i*size,i===nb-1?N:(i+1)*size);bl.push({l:`${i*size+1}~${i===nb-1?N:(i+1)*size}`,v:cdAvg(a.map(r=>r.sc)),n:a.length})}
    const W=340,H=170,L=30,Rr=24,T0=14,Bm=34;
    const lo=Math.floor(Math.min(...bl.map(b=>b.v),ALL)/10)*10-10,hi=Math.min(100,Math.ceil(Math.max(...bl.map(b=>b.v),ALL)/10)*10+10);
    const x=i=>L+(W-L-Rr)*(bl.length===1?.5:i/(bl.length-1)),y=v=>T0+(H-T0-Bm)*(1-(v-lo)/(hi-lo));
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="결정 묶음별 평균 점수 추이">`;

    s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(ALL)}" y2="${y(ALL)}" stroke="#8FA3BC" stroke-dasharray="4 3"/><text x="${L+4}" y="${y(ALL)+13}" font-size="10" fill="#8FA3BC">전체 평균 ${cdF(ALL)}</text>`;
    s+=`<polyline fill="none" stroke="#F2B544" stroke-width="2" stroke-linejoin="round" points="${bl.map((b,i)=>x(i)+","+y(b.v)).join(" ")}"/>`;
    bl.forEach((b,i)=>{const e=i===bl.length-1;s+=`<circle cx="${x(i)}" cy="${y(b.v)}" r="${e?5:3.5}" fill="#F2B544" stroke="#121A29" stroke-width="2"><title>${b.l}번째 결정 · 평균 ${cdF(b.v)}점 · ${b.n}개</title></circle><text x="${x(i)}" y="${y(b.v)-9}" font-size="10.5" fill="#EAF1FA" text-anchor="middle" font-family="IBM Plex Mono,monospace">${cdF(b.v)}</text><text x="${x(i)}" y="${H-12}" font-size="9.5" fill="#8FA3BC" text-anchor="${i===0?"start":e?"end":"middle"}" dx="${i===0?-4:e?6:0}">${b.l}</text>`});
    s+="</svg>";const d=last-first;
    trend=`<p class="cdsub">그래프는 결정을 푼 순서대로 약 ${size}개씩 묶은 ${cdT("score","점수")} 평균이에요. 처음 ${B}개 평균 ${cdF(first)}점, 최근 ${B}개 평균 ${cdF(last)}점으로 ${cdS(d)}점, ${d>=2?"늘고 있어요.":d<=-2?"내려가고 있어요. 쉬어 가며 풀어 보세요.":"큰 변화는 없어요."}</p>${s}`;
  }
  h+=`<div class="cdsecs">`+sec("cd-trend","점수 추이",`처음 ${B}개 ${cdF(first)}점 → 최근 ${B}개 ${cdF(last)}점 (${cdS(last-first)})`,trend);

  {const mx=Math.max(10,Math.ceil(Math.max(0,...ok.map(r=>Math.abs(r.diff)))/5)*5);let b=`<p class="cdsub">전체 평균과 얼마나 다른지(점)를 보여줘요. 평균보다 5점 이상 높으면 ${cdT("sw","강점")}, 5점 이상 낮으면 ${cdT("sw","약점")}이에요. 푼 횟수가 8번 미만인 항목은 숨겼어요.</p><div class="cdleg"><span><i style="background:#5AA9FF"></i>평균보다 높음 (강점)</span><span><i style="background:var(--bad)"></i>평균보다 낮음 (약점)</span></div><div class="cdbars">`;
    D.forEach(d=>{const rs=ok.filter(r=>r.did===d.id);if(!rs.length)return;b+=`<div class="cdgrp">${d.tip?cdT(d.tip,d.name):d.name}</div>`;
      rs.forEach(r=>{const w=Math.abs(r.diff)/mx*50,g=r.diff>=0,lab=r.diff>=5?"cg":r.diff<=-5?"cb":"";const tk=CD_SITK[r.v];

        g+=`<div class="cdhc" style="background:color-mix(in srgb,${d>=0?"#5AA9FF":"var(--bad)"} ${pct}%,#121A29)">${Math.round(v)}<small>${a.length}회</small></div>`}});

     `<p class="cdsub">칸마다 평균 점수예요. 파랑이 진할수록 평균보다 높고, 빨강이 진할수록 낮아요. 푼 횟수가 5번 미만인 칸은 비워 뒀어요. 세로는 ${cdT("pos","포지션")}, 가로는 ${cdT("street","스트리트")}예요.</p><div class="cdheat">${g}</div>`)}

// ================= 핸드 퀴즈 상세 해설: 실제 계산 + 교재 차트 =================
const DSUITS=["♠","♥","♦","♣"];
const DECK52=[];for(const r of "23456789TJQKA")for(const s of DSUITS)DECK52.push(r+s);
function clsIdx(cards){const a=cards[0],b=cards[1];const ia=DRK.indexOf(a[0]),ib=DRK.indexOf(b[0]);const hi=Math.min(ia,ib),lo=Math.max(ia,ib);
  if(hi===lo)return hi*13+hi;const suited=a.slice(1)===b.slice(1);return suited?hi*13+lo:lo*13+hi}
// hero share of the pot vs the given villain hands (ties split), exact enumeration after the flop, sampled preflop
function equityVs(hero,vills,board){
  const used=new Set([...hero,...vills.flat(),...board]);const rest=DECK52.filter(c=>!used.has(c));const need=5-board.length;
  let tot=0,share=0;
  const score=run=>{const b=board.concat(run);const hr=best7(hero.concat(b));let best=hr,win=1,ties=1;
    for(const v of vills){const r=best7(v.concat(b));const c=cmp(r,best);if(c>0){best=r;win=0;ties=1}else if(c===0){ties++}}
    if(cmp(hr,best)===0)share+=1/ties;tot++};
  if(need===0)score([]);
  else if(need===1)rest.forEach(c=>score([c]));
  else if(need===2){for(let i=0;i<rest.length;i++)for(let j=i+1;j<rest.length;j++)score([rest[i],rest[j]])}
  else{for(let t=0;t<2500;t++){const d=rest.slice();const run=[];for(let k=0;k<need;k++){const x=k+Math.floor(Math.random()*(d.length-k));[d[k],d[x]]=[d[x],d[k]];run.push(d[k])}score(run)}}
  return share/tot;
}
const RV=c=>"23456789TJQKA".indexOf(c[0]);
function strengthText(hero,board){
  if(board.length<3)return null;
  const best=best7like(hero.concat(board));
  const cat=best[0];let name=HN[cat];
  const bv=board.map(RV).sort((x,y)=>y-x),hv=hero.map(RV);
  if(cat===1){const pr=best[1];
    if(hv[0]===hv[1]&&hv[0]===pr)name=pr>bv[0]?"오버페어":pr<bv[bv.length-1]?"언더페어":"포켓페어 (보드 중간)";
    else if(hv.includes(pr)){name=pr===bv[0]?"탑페어":pr===bv[1]?"세컨드 페어":"약한 페어";const k=hv.find(x=>x!==pr);if(pr===bv[0]&&k!==undefined)name+=k>=9?" · 좋은 키커":" · 약한 키커"}
    else name="보드 페어 (히어로 카드는 하이카드)";}
  else if(cat===2&&!hv.some(x=>best.slice(1,3).includes(x)))name="보드 투페어 (히어로는 키커만)";
  return name;
}
// cards that lift the hero to a straight or better (or pair-up/trips to two pair+) on the next card, from the hero's view
function outsInfo(hero,board){
  if(board.length<3||board.length>4)return null;
  const used=new Set([...hero,...board]);const rest=DECK52.filter(c=>!used.has(c));
  const now=best7like(hero.concat(board));let outs=0,flush=false,straight=false,full=false;
  for(const c of rest){const r=best7like(hero.concat(board,[c]));if(r[0]>now[0]&&r[0]>=4){
      // count only improvements that use a hero card
      const bo=board.length+1>=5?best7like(board.concat([c])):null;if(!bo||cmp(r,bo)>0){outs++;if(r[0]===5)flush=true;if(r[0]===4)straight=true;if(r[0]>=6)full=true}}}
  const unseen=rest.length;
  const p1=outs/unseen;const p2=board.length===3?1-((unseen-outs)*(unseen-outs-1))/(unseen*(unseen-1)):p1;
  const kinds=[flush?"플러시":"",straight?"스트레이트":"",full?"풀하우스 이상":""].filter(Boolean).join("·");
  return{outs,p1,p2,kinds};
}
function best7like(cs){if(cs.length===5)return rank5(cs);let b=null;const n=cs.length;
  for(let i=0;i<n;i++)for(let j=(n===6?i:i+1);j<n;j++){const five=cs.filter((_,k)=>n===6?k!==i:(k!==i&&k!==j));if(five.length!==5)continue;const r=rank5(five);if(!b||cmp(r,b)>0)b=r}
  return b}
// preflop chart reference for this hand's first decision
const QPOS=p=>p==="MP"?"UTG+2":p;
function chartRef(h){
  const D=h.d||100,me=QPOS(h.me),pf=h.pf;const unopened=pf[1]<=1;
  const stacks=[15,25,40,75];
  const near=stacks.reduce((a,b)=>Math.abs(b-D)<Math.abs(a-D)?b:a,stacks[0]);
  if(unopened&&me!=="BB"){
    if(D===10)return{sp:{kind:"pf10",st:10,pos:me,spot:"rfi"},exact:true};
    const st=stacks.includes(D)?D:near;const c=DRILL_CHARTS.find(x=>x.st===st&&x.pos===me&&x.spot==="rfi");
    return c?{sp:{kind:"chart",...c},exact:st===D,from:st}:null;
  }
  if(me==="BB"&&QPOS(h.vs)==="BTN"&&!h.multi&&pf[1]<=3&&D>=25){const c=DRILL_CHARTS.find(x=>x.spot==="vs_open");return{sp:{kind:"chart",...c},exact:D===40,from:40}}
  if(!h.multi&&/올인/.test(h.s[0].a)&&D<=15&&DPOS.indexOf(QPOS(h.vs))<DPOS.indexOf(me)){const k=QPOS(h.vs)+">"+me;if(DRILL_PF10.call[k])return{sp:{kind:"pf10",st:10,pos:me,op:QPOS(h.vs),spot:"vs_shove"},exact:D===10,from:10}}
  return null;
}

  const note=ref.exact?"":`<p class="warn2">이 핸드는 ${h.d||100}BB라 정확히 맞는 차트가 없어요. 가장 가까운 ${ref.from}BB ${sp.kind==="chart"?"프리플랍 차트":"계산 근사"}를 참고용으로만 보여줘요. 스택이 다르면 정답도 달라질 수 있어요.</p>`;

function detailBlock(h,d){

// players who may not write the shared store (outside guests) send their record as presence; the owner's open page writes it for them
function lbPresence(){
  if(!LB.room||LB.owner||!MYNAME||LB.season===null)return;
  LB.room.presence({app:"hgq",acc:accMine(),name:MYNAME,season:LB.season,kick:+(lsGet("hgq-kick")||0),hands:STATS.n,sum:STATS.sum,best:STATS.best,dn:DSTATS.n,dsum:DSTATS.sum,dbest:DSTATS.best}).catch(()=>{});
}
function lbClean(pr){
  const I=(v,max)=>{v=Math.floor(+v);return Number.isFinite(v)&&v>=0?Math.min(v,max):0};
  if(!pr||pr.app!=="hgq"||typeof pr.name!=="string")return null;
  const name=pr.name.replace(/[\u0000-\u001f\u007f]/g,"").replace(/\s+/g," ").trim().slice(0,12);if(!name)return null;
  const hands=I(pr.hands,100000),dn=I(pr.dn,100000);
  const sum=Math.min(I(pr.sum,1e7),hands*100),dsum=Math.min(I(pr.dsum,1e7),dn*100);
  return{name,season:I(pr.season,1e9),hands,sum,avg:hands?Math.round(sum/hands*10)/10:0,best:Math.min(I(pr.best,1e5),hands),dn,dsum,davg:dn?Math.round(dsum/dn*10)/10:0,dbest:Math.min(I(pr.dbest,1e5),dn)};
}
function lbRelay(peer){
  if(!LB.owner||!LB.db||!peer||peer.kind!=="viewer"||peer.isMe||!peer.by)return;
  if(!accOk(peer.presence)||isBlocked(peer.by))return;
  const r=lbClean(peer.presence);if(!r||r.season!==LB.season)return;
  if((+LB.kicks[peer.by]||0)>(+(peer.presence||{}).kick||0))return;
  if(!LB.rowsReady)return;
  const cur=LB.rows.find(x=>x.id===peer.by);
  const row={...r};
  // a player on a fresh device reports a smaller record until it loads the saved one: keep the bigger side per mode
  if(cur&&cur.season===r.season&&(+cur.at||0)>(+LB.kicks[peer.by]||0)){
    if((+cur.hands||0)>row.hands){row.hands=+cur.hands;row.sum=+cur.sum||0;row.avg=+cur.avg||0;row.best=+cur.best||0}
    if((+cur.dn||0)>row.dn){row.dn=+cur.dn;row.dsum=+cur.dsum||0;row.davg=+cur.davg||0;row.dbest=+cur.dbest||0}
  }
  if(cur&&cur.season===row.season&&cur.hands===row.hands&&cur.dn===row.dn&&cur.name===row.name)return;
  LB.relayQ.set(peer.by,{...row,via:"relay",guest:!!peer.guest,at:Date.now()});lbRelayRun();
}
async function lbRelayRun(){
  if(LB.relaying)return;LB.relaying=true;
  try{while(LB.relayQ.size){const [id,row]=LB.relayQ.entries().next().value;LB.relayQ.delete(id);
    try{await LB.db.doc("scores/"+id).set(row)}catch(e){}}}finally{LB.relaying=false}
}
// the shared record is the source of truth: a fresh browser, another device, or a new page version starts with empty local

function lbAdopt(){
  if(!LB.uid||LB.season===null)return;
  const r=LB.rows.find(x=>x.id===LB.uid);if(!r||r.season!==LB.season)return;
  if((+r.at||0)<=(+LB.kicks[LB.uid]||0))return;
  let ch=false;
  if((+r.hands||0)>STATS.n){STATS={n:+r.hands,sum:+r.sum||Math.round((+r.avg||0)*(+r.hands)),streak:0,best:+r.best||0};saveStats(STATS);ch=true}

// write this viewer's row from the local record; one write at a time, the latest state wins
async function lbPush(){
  lbPresence();

  if(!LB.rowsReady){LB.pendPush=true;return}
  lbAdopt();

  LB.pushing=true;
  try{do{LB.again=false;
    await LB.db.doc("scores/"+LB.uid).set({name:MYNAME,season:LB.season,hands:STATS.n,sum:STATS.sum,avg:STATS.n?Math.round(STATS.sum/STATS.n*10)/10:0,best:STATS.best,
      dn:DSTATS.n,dsum:DSTATS.sum,davg:DSTATS.n?Math.round(DSTATS.sum/DSTATS.n*10)/10:0,dbest:DSTATS.best,at:Date.now()});
  }while(LB.again)}catch(e){if(e&&e.code==="invalid_argument"){LB.writeFail=true;if(window.HGQ_WEB&&!LB.owner){lsSet("hgq-acc","");ACC.sig=null;gateCheck()}if(SCREEN==="menu")lbRender()}}

// one record → the numbers a tab ranks by; "all" pools every scored round from both modes
// overall score/grade only once both modes have ALL_MIN rounds each
const ALL_MIN=5;
function allReady(hn,dn){return hn>=ALL_MIN&&dn>=ALL_MIN}
function lbPick(r,tab){
  const hn=+r.hands||0,dn=+r.dn||0;
  if(tab==="hand")return{n:hn,avg:+r.avg||0,best:+r.best||0};
  if(tab==="drill")return{n:dn,avg:+r.davg||0,best:+r.dbest||0};
  const hs=r.sum!=null?+r.sum||0:(+r.avg||0)*hn,ds=r.dsum!=null?+r.dsum||0:(+r.davg||0)*dn,n=hn+dn;
  return{n,hn,dn,avg:n?Math.round((hs+ds)/n*10)/10:0,best:Math.max(+r.best||0,+r.dbest||0)};
}
function lbRowsFor(tab){
  const k={u:tab==="hand"?"핸드":tab==="drill"?"문제":"판"};
  const by=new Map();
  LB.rows.filter(r=>r.season===LB.season&&typeof r.name==="string"&&r.name.trim()&&!isBlocked(r.id)).forEach(r=>by.set(r.id,{id:r.id,name:r.name.slice(0,12),...lbPick(r,tab),live:false}));
  LB.peers.forEach(p=>{if(!p.by||!accOk(p.presence)||isBlocked(p.by))return;const c=lbClean(p.presence);const cur=by.get(p.by);
    if(!c||c.season!==LB.season||(+LB.kicks[p.by]||0)>(+(p.presence||{}).kick||0)){if(cur)cur.live=true;return}
    const v={id:p.by,name:c.name,...lbPick(c,tab),live:true};
    if(!cur||v.n>=cur.n)by.set(p.by,v);else cur.live=true});
  const rows=[...by.values()].filter(r=>r.n>0);
  const MIN=5,ok=r=>tab==="all"?allReady(r.hn,r.dn):r.n>=MIN;
  const ranked=rows.filter(ok).sort((a,b)=>b.avg-a.avg||b.n-a.n),wait=rows.filter(r=>!ok(r)).sort((a,b)=>b.n-a.n);
  return{ranked,wait,u:k.u,MIN};
}

// ---- 결과 카드 (F안): 요약 한 장 + 결정마다 한 장씩 넘겨 보기 ----
function rgMake(h,decs){
  let P;const prep=()=>{if(P===undefined){try{P=rgPrep(h,decs)}catch(e){P=null}}return P};const C={};
  return i=>{if(C[i])return C[i];const d=decs[i];let r={sum:[],html:""};
    try{if(d.si===0)r=rgPre(h,decs);else{const p=prep();r=!p?r:p.skip?{sum:[],html:`<div class="rx"><b>${ST[d.si]} 레인지 분석</b><p>${p.skip}</p></div>`}:(rgPost(h,decs,i,p)||r)}}catch(e){}
    return C[i]=r}}
function plainTxt(t){return String(t||"").replace(/<em>[\s\S]*$/,"").replace(/<[^>]+>/g,"").trim()}
function resCards(h,sc,tot){
  const decs=G.dec.slice(),n=decs.length,total=n+1,get=rgMake(h,decs);

    $("prog").querySelectorAll("button[data-pg]").forEach(b=>b.onclick=()=>go(+b.dataset.pg))}

    return `<div class="rcpg"><span class="rclab">이 핸드 요약</span>
     <div class="scr"><div><div class="big">${tot}<span> / 100</span></div></div><span class="grade ${gradeCls(tot)}">${gradeTxt(tot)}</span></div>
     <p class="rchead">${head}</p>
     <div class="rcrows">${rows}</div>
     ${bandHTML()}
     <div class="cx key"><span class="k">이 핸드의 핵심</span><div>${h.key}</div></div>
     <p class="dlv"><span class="dlt d${hDiff(h).t}">난이도 ${DIFF_NAME[hDiff(h).t]}</span>${h.multi?"멀티웨이 · ":""}결정 ${n}번 중 섞어 쓰는 결정 ${decs.filter(d=>hDecT(d.f)===3).length}번</p>
     <div class="statrow"><span>누적 <b>${STATS.n}</b>핸드 · 평균 <b>${avgOf()}</b> ${tierTag(STATS.sum/STATS.n,STATS.n)}</span><span>연속 90점+ <b>${STATS.streak}</b></span></div>
     <div id="myrank" data-tab="hand">${lbMyRank("hand")}</div></div>`}
  function street(i){
    const d=decs[i],bk=bestOf(d.o,d.f),bd=boardUpTo(h,d.si),r=ready[i]?get(i):null,same=d.k===bk,mine=lab(d.o,d.k),best=lab(d.o,bk);
    const bars=d.o.slice().sort((a,b)=>(+d.f[b[0]]||0)-(+d.f[a[0]]||0)).map(([k,l])=>{const v=+d.f[k]||0,me=k===d.k,pt=strictPts(d.f,k),ok=pt===100;
      return `<div class="fq ${ok?"ok":""} ${me?"me":""} ${pt===0?"zero":""}"><div class="fq1"><span class="fql">${l}</span>${ok?`<em class="fqc ok">정답</em>`:""}${me?`<em class="fqc me">${d.to?"시간 초과":"내 선택"}</em>`:""}</div><div class="fqt"><i style="width:${Math.max(v,1.5)}%"></i></div><div class="fqr"><span class="fqv">${v}%</span><span class="fqp">${pt}점</span></div></div>`}).join("");
    const top2=d.o.slice().sort((a,b)=>(+d.f[b[0]]||0)-(+d.f[a[0]]||0)).slice(0,2).map(([k,l])=>`${l} ${+d.f[k]||0}%`).join(" · ");
    const det=detailBlock(h,d);
    const secs=[{id:"freq",t:"GTO 빈도",peek:top2,body:`${bars}<span class="rcnote">GTO가 이 상황에서 각 행동을 고르는 비율(예시 수치)이에요. 비율이 높을수록 점수가 높아요.</span>`}];
    const sumRows=r?(r.sum||[]):[];
    if(!r||r.html)secs.push({id:"rx",t:d.si===0?"프리플랍 차트":"레인지 분석",peek:d.si===0?"내 핸드가 차트에서 어느 분류인지 봐요":"빌런 레인지와 승률을 비교해요",body:r?r.html:`<p class="rxload">${d.si===0?"차트와 레인지 승률 계산 중…":"레인지 분석 계산 중…"}</p>`});
    if(det)secs.push({id:"calc",t:"계산",peek:"팟 오즈 · 필요 승률 · 기대값",body:det});
    const vt=plainTxt(d.a);
    return `<div class="rcpg"><span class="rcname">${d.label}</span>
     <div class="rcvil">${hl(d.a)}</div>
     <div class="rctbl">${bd.length?`<div><div class="t">보드</div><div class="cr">${bd.map(c=>bigCard(c,"sm")).join("")}</div></div>`:""}
      <div class="hr ${bd.length?"l":""}"><div class="cr">${h.hand.map(c=>bigCard(c,"sm hc")).join("")}</div><div class="hi"><b>히어로 ${h.me}</b><span>스택 ${d.hs0}BB · 팟 ${d.pot}BB</span></div></div></div>
     <div class="rcpick"><div class="${sc[i]>=90?"ok":""}"><small>내 선택</small><b>${lab(d.o,d.k)}</b><span>${sc[i]}점</span></div><div class="g"><small>정답 · GTO 1순위</small><b>${lab(d.o,bk)}</b><span>GTO ${+d.f[bk]||0}%</span></div></div>
     <p class="rcwhy">${d.n}</p>
     <div class="rcrs"><b>${same?"이 선택이 맞는 이유":`${ga(best)} 더 좋은 이유`}</b>
      <p class="rcrl">${same?`GTO가 가장 자주 고르는 행동(${best}, ${+d.f[bk]||0}%)과 같아요.`:`GTO는 이 상황에서 <b>${best}</b>를 가장 자주(${+d.f[bk]||0}%) 골라요. 내가 고른 ${mine}은 ${+d.f[d.k]||0}%라서 ${sc[i]}점이에요.`}</p>
      ${r?(sumRows.length?`<ul>${sumRows.map(([k,v])=>`<li><span>${k}</span><div>${v}</div></li>`).join("")}</ul>`:""):`<p class="rxload">근거 계산 중…</p>`}
      <p class="rcrn">숫자 근거는 아래 접이식(차트·레인지 분석·계산)에서 더 자세히 볼 수 있어요.</p></div>
     <div class="rcsecs"><span class="h">자세히 보기 · 터치하면 펼쳐져요</span>${secs.map(x=>{const o=!!open[i+":"+x.id];return `<section class="rcsec ${o?"open":""}"><button data-sec="${x.id}" aria-expanded="${o}"><span><b>${x.t}</b><small>${x.peek}</small></span><em>${o?"−":"+"}</em></button>${o?`<div class="rcbody">${x.body}</div>`:""}</section>`}).join("")}</div></div>`}
  function draw(){

      :`<button class="ghost" id="rcprev">이전</button><button class="cta" ${last?`id="next"`:`id="rcfw"`}>${last?("다음 핸드"):"다음 · "+decs[pg].label}</button>`;
    $("panel").innerHTML=`${body}<div class="rcnav">${nav}</div>`;
    bars();

    if(pg>0&&!ready[pg-1]){const i=pg-1,mine=pg;setTimeout(()=>{if(ready[i])return;get(i);ready[i]=1;if(pg===mine)draw()},60)}

   <button class="ghost" id="menu">처음 화면으로</button>`;

// ---- 프리플랍 첫 결정의 정답을 교재 차트 분류와 맞춤 ----
// 새로 만든 문제의 예시 빈도 중 일부가 차트 분류(콜/오픈/3벳/올인/폴드)와 반대로 정답이 나오던 문제를 막아요.
// 새 숫자는 만들지 않고, 차트가 말하는 행동과 지금 가장 높은 행동의 빈도 값을 서로 바꿔요. 차트에 선택지가 없으면 그대로 둬요.
function pfChartLetter(h){
  try{const D=h.d||100,S=rgBucket(D);if(!S)return null;
    const me=QPOS(h.me),v1=QPOS(h.vs),a=h.s[0].a,unopened=h.pf[1]<=1,vs3=/히어로 [\d.]+BB 오픈 → 빌런 3벳/.test(a),jam=/빌런 [\d.]+BB 올인/.test(a);
    if(jam)return null;const hk=(unopened||vs3)?"O:"+me:defKey(me,v1);
    const c=(RANGES[S]||{})[hk];return c?c.g[clsIdx(h.hand)]:null}catch(e){return null}
}
function chartAlign(){let n=0;
  LEVELS.forEach(L=>L.hands.forEach(h=>{const s0=h.s&&h.s[0];if(!s0||h.__al)return;h.__al=1;
    const L0=pfChartLetter(h);if(!L0)return;
    const keys=s0.o.map(x=>x[0]),isR=k=>k==="raise"||/^b\d+$/.test(k);
    const tk=L0==="f"?keys.find(k=>k==="fold"):L0==="j"?keys.find(k=>k==="jam"):(L0==="c"||L0==="l")?keys.find(k=>k==="call"):(keys.find(isR)||keys.find(k=>k==="jam"));
    if(!tk)return;
    const f=s0.f,top=keys.reduce((a,b)=>(+f[b]||0)>(+f[a]||0)?b:a);
    if((+f[tk]||0)>=(+f[top]||0))return;
    const t=f[tk]||0;f[tk]=f[top];f[top]=t;n++}));
  return n}

chartAlign();
menu();
