<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALLIN IQ · 홀덤 GTO 퀴즈</title>
<meta name="description" content="ALLIN IQ — 홀덤 GTO 퀴즈와 프리플랍 오픈 연습">
<meta name="theme-color" content="#07090F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALLIN IQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* layout: one phone column — top bar, street pills, oval 9-seat table stage, action sheet below. Single dark card-room look in every theme. */
:root{
  --room:#070B12; --sheet:#0B111B; --sheet2:#0A0F18; --line:#1A2536; --line2:#2A3648;
  --fg:#EAF1FA; --muted:#8FA3BC; --dim:#5E708A;
  --rail:#0E1520; --rail2:#1E2A3B; --felt:#12355E; --felt2:#1A4A80; --feltline:#24507F;
  --gold:#F2B544; --gold-soft:#2A1F08; --gold-ink:#F7D488;
  --hero:#5AA9FF; --hero-soft:#0F2238; --hero-ink:#A9D1FF;
  --vil:#FF6B5E; --vil-soft:#2A1218; --vil-ink:#FFB0A8;
  --good:#5DBB7E; --good-ink:#8FD3A6; --good-soft:#132A1D;
  --bad:#E4705E; --bad-ink:#F3A08A; --bad-soft:#33170F;
  --card:#FFFFFF; --red:#D3263A; --black:#1B1D22;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --num:"Barlow Condensed","IBM Plex Mono",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--room);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 28px}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--hero);outline-offset:2px}
.app{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:13px}
/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.iconb{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--sheet);color:var(--muted);display:flex;align-items:center;justify-content:center}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.tt b{font-size:15px;font-weight:700}
.tt span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp{flex:none;font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:999px;background:#1C2A40;color:var(--hero)}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.prog:empty{display:none}
.prog div{font-size:11px;text-align:center;padding:4px 2px;border-radius:6px;background:#111A27;color:#56677E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .done{background:#131C2A;color:var(--muted)}
.prog .now{background:var(--gold);color:#241A06;font-weight:700}
/* table stage */
.tbl{position:relative;width:100%;aspect-ratio:390/580}
.rail{position:absolute;border-radius:50%;background:var(--rail);box-shadow:inset 0 0 0 2px var(--rail2)}
.felt{position:absolute;inset:12px;border-radius:50%;background:var(--felt);box-shadow:inset 0 0 0 2px var(--felt2)}
.fline{position:absolute;inset:26px;border-radius:50%;border:1px dashed var(--feltline)}
.seat{position:absolute;transform:translate(-50%,-30%);display:flex;flex-direction:column;align-items:center;gap:2px;width:60px}
.seat .sc{width:44px;height:44px;border-radius:50%;background:#121A26;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#8FA3BC}
.seat .fd{font-size:10px;color:var(--dim)}
.seat.vil{width:72px;transform:translate(-50%,-32%)}
.seat.vil .sc{width:50px;height:50px;background:var(--vil-soft);border:3px solid var(--vil);color:var(--vil-ink);font-weight:600;font-size:12px}
.tagv{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--vil);color:#2A1405}
.stv{font-family:var(--mono);font-size:12px;color:var(--vil-ink)}
.bub{position:absolute;transform:translate(-50%,-50%);padding:5px 10px;border-radius:10px;background:var(--vil);color:#2A1405;font-size:12px;font-weight:700;white-space:nowrap;z-index:2}
.bub.chk{background:#2A1B10;border:1.5px solid var(--vil);color:var(--vil-ink)}
.chip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13px;color:var(--gold-ink);white-space:nowrap}
.chip i{width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px #B9862A}
.dealer{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--gold-ink);color:#3A2A08;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pot{position:absolute;transform:translate(-50%,-50%);padding:4px 12px;border-radius:999px;background:#0B2240;font-family:var(--mono);font-size:13px;color:var(--gold-ink);white-space:nowrap}
.board{position:absolute;transform:translate(-50%,-50%);display:flex;gap:5px}
.pc.new{box-shadow:0 0 0 2px var(--gold)}
.hole{position:absolute;transform:translate(-50%,-50%);display:flex;gap:6px}
.hplate{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:14px;background:var(--hero-soft);border:2px solid var(--hero);white-space:nowrap}
.tagh{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--hero);color:#0B1D33}
.sth{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--hero-ink)}
.sth small,.sv small{font-size:12px;margin-left:2px}
@media (prefers-reduced-motion:no-preference){.pc.new{animation:deal .35s ease-out}@keyframes deal{from{transform:translateY(-10px);opacity:.3}to{transform:none;opacity:1}}}
/* band (results, menu) */
.band{border-radius:999px;background:var(--rail);padding:10px;box-shadow:inset 0 0 0 2px var(--rail2)}
.bfelt{border-radius:999px;background:var(--felt);padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.bb{display:flex;gap:5px}
.bline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px}
.mini2{display:flex;gap:3px}
.hs2{color:var(--hero-ink)}.vs2{color:var(--vil-ink)}
.hs2 b,.vs2 b{font-family:var(--mono);font-size:15px}
.avg{font-family:var(--mono);font-size:48px;line-height:1;color:var(--gold-ink)}
/* sheet */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.alh{display:flex;align-items:baseline;justify-content:space-between}
.qbox{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:#14120E;border:1px solid #5A4B32}
.coachtile{grid-column:1/-1;min-height:0!important;flex-direction:row!important;align-items:center!important;flex-wrap:wrap;background:#0F1626;border:1px dashed #3A4766!important;color:var(--fg)}
.coachtile.on{background:linear-gradient(160deg,#1B2640,#121A29);border:1px solid #D4AF7C!important}
.coachtile .ts2{flex:1 1 140px;font-size:12px;color:var(--muted);line-height:1.5}
.coachtile .tgo{align-self:center!important;flex:none;padding:0 14px;background:rgba(212,175,124,.16);color:#F0D7AE}
.coc{border-radius:18px;background:#121A29;border:1px solid #263048;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.coc small{font-size:12px;color:var(--muted);font-weight:700}
.coc.sum{background:linear-gradient(160deg,#1B2640,#121A29);border-color:#D4AF7C}.coc.sum>b{font-size:18px;line-height:1.5}
.coc.weak{background:#1A1210;border-color:#5A3A2E}.coc.weak small{color:#F2B5A4}
.coc.strong{background:#10261B;border-color:#1B4A33}.coc.strong small{color:#7FD4A6}
.coc.lock{border-style:dashed}
.cohd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.cohd>div{display:flex;flex-direction:column;gap:2px;min-width:0}.cohd b{font-size:17px;line-height:1.4;word-break:keep-all}
.cosc{font-family:var(--mono);font-style:normal;font-size:26px;font-weight:700;color:#FF8A78}.coc.strong .cosc{color:#A7EBC6}
.cob{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12px;color:#CFC7B5}
.cob i{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;display:block}.cob u{display:block;height:100%;background:#E5604D}
.coc.strong .cob u{background:#5FC892}.coc.sum .cob u,.coc.lock .cob u{background:#D4AF7C}
.cob b{font-family:var(--mono);text-align:right;font-weight:600}
.cosub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cobg{padding:3px 10px;border-radius:999px;font-weight:700;border:1px solid #3A4766;color:#F0D7AE;background:#1B2640}.cobg.up{background:#10261B;color:#A7EBC6;border-color:#1B4A33}.cobg.down{background:#2A1B16;color:#F2B5A4;border-color:#5A3A2E}
.cowhy{margin:0;font-size:13px;line-height:1.7;color:#E6E1D6}
.cot2{border-radius:12px;background:rgba(0,0,0,.25);padding:12px 14px;display:flex;flex-direction:column;gap:6px}.cot2 b{font-size:13px;color:#F0D7AE}.cot2 span{font-size:13px;line-height:1.6;color:#E6E1D6}
.cot2 ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.6;color:#E6E1D6}
.cof{font-size:14px}
.qtm{display:flex;align-items:center;gap:8px;font-size:12px;color:#B9A27A}.qtm .tb{flex:1;height:6px;border-radius:999px;background:#2A2418;overflow:hidden}.qtm i{display:block;height:100%;width:100%;background:#D4AF7C}.qtm b{font-family:"JetBrains Mono",monospace;font-size:15px;min-width:22px;text-align:right;color:#F0D7AE}.qtm.low i{background:#E5604D}.qtm.low b{color:#FF8A78}
.qtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qmeta{font-size:12px;color:#A39C8E}.qmeta b{font-family:var(--mono);color:#EAD3AE;font-weight:600}
.qq{margin:0;font-size:19px;line-height:1.45;font-weight:800;color:#F8F9FB;text-wrap:balance}
.qq .qv{color:#FFB199}.qq .qh{color:#F0D7AE}.qq .num{color:#F0D7AE}
.qsub{display:block;margin-top:4px;font-size:12px;font-weight:500;color:#A39C8E}
.qlog{display:flex;flex-direction:column;gap:6px}.qlt{font-size:11px;font-weight:700;letter-spacing:.1em;color:#7C756A}
.qlog .ar{font-size:14px}
.btns{transition:opacity .25s}.btns.wait{opacity:.35;pointer-events:none}
.seat.wt .fd{color:#9AA3B5!important;font-weight:700}
.hplate .yt{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:#F0D7AE;color:#0B1220}
.tbl.anim .seat.sq{animation:seatturn .6s ease var(--d) both}
.tbl.anim .seat.sq .fd,.tbl.anim .seat.sq .act,.tbl.anim .bet.sq{animation:popin .3s ease var(--d) both}
.tbl.anim .hplate{animation:heroturn 1.4s ease var(--dh) both}
.tbl.anim .hplate .yt{animation:popin .3s ease var(--dh) both}
@keyframes seatturn{0%{filter:none}40%{filter:drop-shadow(0 0 10px rgba(240,215,174,.9)) brightness(1.35)}100%{filter:none}}
@keyframes popin{from{opacity:0}to{opacity:1}}
@keyframes heroturn{0%{box-shadow:0 0 0 0 rgba(240,215,174,0)}45%{box-shadow:0 0 0 9px rgba(240,215,174,.4)}100%{box-shadow:0 0 0 3px rgba(212,175,124,.12)}}
@media (prefers-reduced-motion:reduce){.tbl.anim *{animation:none!important}}
.als{font-size:16px;font-weight:700}
.turn{font-size:12px;font-weight:700;color:var(--hero)}
.steps2{display:flex;flex-direction:column;gap:6px}
.ar{display:flex;align-items:center;gap:8px;font-size:15px;line-height:1.4}
.who{flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;min-width:48px;text-align:center}
.who.h{background:var(--hero);color:#0B1D33}
.who.v{background:var(--vil);color:#2A1405}
.who.n{background:var(--line2);color:var(--muted)}
.at2{min-width:0}
.num{font-family:var(--mono);font-weight:600}
.hintb{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--gold-soft);color:#F3E6C4}
.hintb span{font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap}
.btns{display:grid;gap:6px}
.btns.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.btns.n3{grid-template-columns:repeat(3,minmax(0,1fr))}.btns.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.b{min-height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px}
.bm{font-size:16px;font-weight:700}
.bs{font-family:var(--mono);font-size:11px}
.b.g{border:1px solid var(--line2);background:#131C2A;color:#A3B3C6}
.b.c{border:1px solid #2D4A6B;background:#16263A;color:var(--hero-ink)}.b.c .bs{color:#9CC4EE}
.b.r{border:1px solid #5A4520;background:var(--gold-soft);color:var(--gold-ink)}.b.r .bs{color:#E2C47E}
.b.j{border:1px solid #7A3A2A;background:var(--bad-soft);color:#FFC2AE}.b.j .bs{color:var(--bad-ink)}
.b:hover{filter:brightness(1.15)}
.note{margin:0;font-size:11px;color:var(--dim);text-align:center}
/* levels */
.lvls{display:flex;flex-direction:column;gap:8px}
.lv{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line2);background:#131C2A}
.lv:hover{border-color:var(--gold)}
.ln{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px;background:var(--felt);color:var(--gold-ink);box-shadow:inset 0 0 0 3px var(--rail)}
.lt{display:flex;flex-direction:column;min-width:0}
.lt b{font-size:16px;font-weight:700}
.lt small{font-size:12px;color:var(--muted)}
.lb{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* results */
.scr{display:flex;align-items:center;gap:12px}
.big{font-family:var(--mono);font-size:46px;font-weight:600;line-height:1;color:var(--gold-ink)}
.big span{font-size:16px;color:var(--muted)}
.grade{margin-left:auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;text-align:center}
.g-good{background:var(--good-soft);color:var(--good-ink)}
.g-warn{background:#3A2E12;color:var(--gold-ink)}
.g-bad{background:var(--bad-soft);color:var(--bad-ink)}
.rows{border-radius:14px;background:var(--sheet2);padding:2px 12px}
.row{border-bottom:1px solid #1A2536}
.row:last-child{border-bottom:none}
.row>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) 36px;gap:10px;align-items:center;padding:10px 0;cursor:pointer}
.row>summary::-webkit-details-marker{display:none}
.sn{font-size:13px;font-weight:700;white-space:nowrap}
.sm2{font-size:12px;color:#A3B3C6;min-width:0}
.cb{color:#9CC4EE}.cg{color:var(--good-ink)}
.n{font-family:var(--mono);font-size:15px;text-align:right}
.n.good{color:var(--good-ink)}.n.warn{color:var(--gold)}.n.bad{color:var(--bad-ink)}
.rbody{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.rb{display:flex;gap:3px}
.sa{font-size:13px;color:#C4D0DE}
.bars{display:flex;flex-direction:column;gap:6px;background:#090E16;border-radius:10px;padding:10px}
.ab{display:grid;grid-template-columns:72px minmax(0,1fr) 38px auto;gap:8px;align-items:center;font-size:13px}
.ab .al{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#C4D0DE}
.ab.me .al{font-weight:700;color:var(--hero)}
.at{height:12px;background:#1A2536;border-radius:6px;overflow:hidden}
.at i{display:block;height:100%;border-radius:6px;background:#3E4D61}
.at i.top{background:var(--good)}.at i.mine{background:var(--hero)}
.av{text-align:right;font-family:var(--mono)}
.am{display:flex;gap:3px}
.am em{font-style:normal;font-size:10px;padding:1px 6px;border-radius:999px;white-space:nowrap}
.mh{background:var(--hero);color:#0B1D33}.mg{background:var(--good);color:#0B2214}
.rbody p{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:380px){.ab{grid-template-columns:60px minmax(0,1fr) 36px}.am{grid-column:2/4}}
.cx{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.6}
.cx .k{font-size:11px;font-weight:700}
.cx.key{background:var(--gold-soft);border:1.5px solid var(--gold);color:#F6EBCF;font-size:15px}
.cx.key .k{color:var(--gold)}
.cx.ok{background:var(--good-soft);color:#D5EEDD}.cx.ok .k{color:var(--good-ink)}
.cx.ng{background:var(--bad-soft);color:#F6D6CD}.cx.ng .k{color:var(--bad-ink)}
.cta{width:100%;min-height:54px;border-radius:14px;border:none;background:var(--gold);color:#241A06;font-size:16px;font-weight:700}
.ghost{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:14px}
.mini{display:flex;flex-direction:column}
.mini div{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid var(--line);padding:9px 0}
.mini .n{font-size:15px;color:var(--gold-ink)}
.seat.vil.out{opacity:.55}
.vrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;max-width:330px;font-size:12px;text-align:left}
.vrow.out{opacity:.6}
.hn{color:#E6EDF6;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stv2{font-family:var(--mono);font-size:12px;color:var(--vil-ink)}
.stv2.h{color:var(--hero-ink)}
.pc.vc{box-shadow:0 0 0 2px var(--vil)}
.pc.run{opacity:.45}
.runl{font-size:11px;color:#A9C2E0}
.sdn{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#0B2240;color:var(--gold-ink)}
.sdn.good{background:var(--good-soft);color:var(--good-ink)}
.sdn.bad{background:var(--bad-soft);color:var(--bad-ink)}
.sdn.warn{background:#3A2E12;color:var(--gold-ink)}
.band{border-radius:36px}.bfelt{border-radius:28px}
.startc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#131C2A;border:1px solid var(--line2)}
.sct{flex:1;display:flex;flex-direction:column;min-width:0}
.sct b{font-size:16px}
.sct small{font-size:12px;color:var(--muted)}
.statrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.statrow b{font-family:var(--mono);color:var(--gold-ink);font-weight:600}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats3 div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:14px;background:#131C2A;border:1px solid var(--line2);text-align:center}
.stats3 span{font-size:11px;color:var(--muted)}
.stats3 b{font-family:var(--mono);font-size:24px;color:var(--gold-ink)}
.mode{border:1px solid var(--line2);background:#131C2A;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}

/* ===== responsive policy (project tiers, CSS px of the live viewport; never device names) =====

:root{--gut:16px;--gap:8px;--tblr:250px}
body{font-size:16px;min-height:100vh;min-height:100dvh;
  padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}

/* the table never pushes the decision off a short phone: width follows the window height */
#stage .tbl{margin-inline:auto;max-width:max(250px,calc((100vh - var(--tblr)) * .6724))}
@supports (height:100dvh){#stage .tbl{max-width:max(250px,calc((100dvh - var(--tblr)) * .6724))}}
@media (max-width:359px){.btns.n4{grid-template-columns:repeat(2,minmax(0,1fr))}.btns .bm{font-size:15px}.btns .b{padding-inline:2px}}

  const kick=g.map(x=>x[1]);
  if(st>=0&&fl)return[8,st];
  if(g[0][0]===4)return[7,...kick];
  if(g[0][0]===3&&g[1][0]===2)return[6,...kick];

// ================= 프리플랍 오픈 연습 (MTT9 v0.6 자료) =================
// 15·25·40·75BB: 프리플랍 강의 교재 차트(학습용 분류, 혼합 빈도 아님) → "차트와 일치" 연습으로만 채점.
// 10BB: 앱과 같은 조건으로 직접 계산한 푸시/폴드 근사(첫 콜러 모델) → 빈도와 EV로 채점.
const DPOS=["UTG","UTG+1","UTG+2","LJ","HJ","CO","BTN","SB","BB"];
const DRK="AKQJT98765432";
const DH=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++)DH.push(i===j?DRK[i]+DRK[i]:(i<j?DRK[i]+DRK[j]+"s":DRK[j]+DRK[i]+"o"));
const dComb=h=>h.length===2?6:(h[2]==="s"?4:12);
const DACT={f:"폴드",l:"림프",c:"콜",r:"오픈",j:"올인"};
const DCOL={f:"#1A2536",l:"#3E9E5F",c:"#3A7FC4",r:"#D9A13B",j:"#D9534A"};
const DORDER="flcrj";
let DS=null; // current drill question
function dLoad(){try{return JSON.parse(localStorage.getItem("hgq-drill")||"null")||{n:0,sum:0,streak:0,best:0}}catch(e){return{n:0,sum:0,streak:0,best:0}}}
function dSave(){try{localStorage.setItem("hgq-drill",JSON.stringify(DSTATS))}catch(e){}}
let DSTATS=dLoad();

function dActLabel(sp,l){
  if(l==="r"){if(sp.spot==="vs_open")return"3벳";if(sp.pos==="SB")return"레이즈 3.5BB";return sp.st>=40?"오픈 2.2BB":"오픈 2BB"}
  return DACT[l];
}
function dPick(arr){return arr[Math.floor(Math.random()*arr.length)]}
// spots: chart RFI (7 positions x 4 stacks), SB first-in (4), BB vs BTN 40BB, 10BB jam (8), 10BB facing a jam (36)
function dSpot(){
  const u=Math.random();
  if(u<0.50){const c=dPick(DRILL_CHARTS.filter(c=>c.spot==="rfi"&&c.pos!=="SB"));return{kind:"chart",...c}}
  if(u<0.62){const c=dPick(DRILL_CHARTS.filter(c=>c.spot==="rfi"&&c.pos==="SB"));return{kind:"chart",...c}}
  if(u<0.70){const c=DRILL_CHARTS.find(c=>c.spot==="vs_open");return{kind:"chart",...c}}
  if(u<0.88){const p=dPick(DPOS.slice(0,8));return{kind:"pf10",st:10,pos:p,spot:"rfi"}}
  const k=dPick(Object.keys(DRILL_PF10.call));const [op,pos]=k.split(">");return{kind:"pf10",st:10,pos,op,spot:"vs_shove"}
}
// what each hand class does in this spot: letter for charts, frequency of the aggressive action for 10BB
function dGrid(sp){
  if(sp.kind==="chart")return sp.g.split("");
  const f=sp.spot==="rfi"?DRILL_PF10.jam[sp.pos]:DRILL_PF10.call[sp.op+">"+sp.pos];
  return f.map(x=>x>=0.5?(sp.spot==="rfi"?"j":"c"):"f");
}

function diffSet(mode){if(!DIFF_PRESETS[mode])mode="mid";DIFF_MODE=mode;const m=DIFF_PRESETS[mode].mix;DIFF_MIX=[[1,m[0]/100],[2,m[1]/100],[3,m[2]/100]]}
const DIFF_NAME={1:"쉬움",2:"보통",3:"어려움"};
function diffRoll(){let u=Math.random();for(const [t,p] of DIFF_MIX){if(u<p)return t;u-=p}return 2}
const diffOrder=t=>t===1?[1,2,3]:t===2?[2,3,1]:[3,2,1];
// chart spots: along the hand's own kicker line (same top card & suitedness, or the pair ladder),

function dLineDist(g,idx){const r=Math.floor(idx/13),c=idx%13;let line;

  const p=line.indexOf(idx);let d=99;line.forEach((j,q)=>{if(g[j]!==g[idx])d=Math.min(d,Math.abs(q-p))});return d}

function dDiff(sp,idx){

  if((f>0.1&&f<0.9)||ev<0.3)return{t:3,why:(f>0.1&&f<0.9)?"두 행동을 섞어 쓰는 핸드":`두 행동의 EV 차이 ${ev.toFixed(2)}BB`};
  if(ev<1.0)return{t:2,why:`두 행동의 EV 차이 ${ev.toFixed(2)}BB`};return{t:1,why:`두 행동의 EV 차이 ${ev.toFixed(1)}BB`}}
const D_TIERS={};
function dTiers(sp){const key=sp.kind+"|"+sp.spot+"|"+sp.pos+"|"+(sp.op||"")+"|"+sp.st;
  if(!D_TIERS[key]){const t={1:[],2:[],3:[]};for(let i=0;i<169;i++)t[dDiff(sp,i).t].push(i);D_TIERS[key]=t}return D_TIERS[key]}
let D_LAST=-1;
function dHand(sp){
  const T=dTiers(sp);let pool=[];
  for(const t of diffOrder(diffRoll())){pool=T[t].filter(i=>i!==D_LAST);if(pool.length)break}
  let t=pool.reduce((s,i)=>s+dComb(DH[i]),0)*Math.random(),pick=pool[pool.length-1];
  for(const i of pool){t-=dComb(DH[i]);if(t<=0){pick=i;break}}

}
// hand quiz: a decision is 쉬움 when one action is used 85%+ of the time, 보통 at 60–84%, 어려움 below 60% (a real mix).
// a hand's level is the average over its main-line decisions, +0.3 for a multiway pot: under 1.6 쉬움, 1.6–2.2 보통, above 2.2 어려움
function hDecT(f){const m=Math.max(...Object.values(f).map(Number));return m>=85?1:m>=60?2:3}
function hDiff(h){const ts=h.s.map(st=>hDecT(st.f));const D=ts.reduce((a,b)=>a+b,0)/ts.length+(h.multi?0.3:0);return{D,t:D<1.6?1:D<=2.2?2:3}}
function dCards(idx){
  const h=DH[idx],S=["♠","♥","♦","♣"],sh=S.slice().sort(()=>Math.random()-0.5);
  if(h.length===2)return[h[0]+sh[0],h[1]+sh[1]];
  if(h[2]==="s")return[h[0]+sh[0],h[1]+sh[0]];
  return[h[0]+sh[0],h[1]+sh[1]];
}

}

function dSituation(sp){

function dSource(sp){return sp.kind==="chart"?`프리플랍 차트 · ${sp.st}BB`:"10BB 직접 계산 근사 · 첫 콜러 모델 · cEV"}

function dMiniGrid(sp,hi){

function coachAgg(rs){if(!rs.length)return{n:0,avg:0};return{n:rs.length,avg:rs.reduce((a,r)=>a+r.sc,0)/rs.length}}
function coachWin(g,lo,hi){return CL[g].filter(r=>r.i>lo&&r.i<=hi)}
function coachInfo(){
  const nh=CL.hn,nd=CL.dn,ready=nh>=COACH_MIN&&nd>=COACH_MIN;
  const out={nh,nd,ready,weak:[],strong:[]};if(!ready)return out;
  const cur={h:coachWin("h",nh-COACH_MIN,nh),d:coachWin("d",nd-COACH_MIN,nd)};
  const prev={h:coachWin("h",nh-2*COACH_MIN,nh-COACH_MIN),d:coachWin("d",nd-2*COACH_MIN,nd-COACH_MIN)};
  const tot={h:coachAgg(cur.h),d:coachAgg(cur.d)};
  out.tot=tot;out.timeouts=cur.h.filter(r=>r.to).length;
  const rows=[];
  COACH_CATS.forEach(c=>{
    const a={h:coachAgg(cur.h.filter(c.f)),d:coachAgg(cur.d.filter(c.f))};
    const pa={h:coachAgg(prev.h.filter(c.f)),d:coachAgg(prev.d.filter(c.f))};
    const both=c.only!=="h"&&a.h.n>=COACH_SAMP&&a.d.n>=COACH_SAMP;
    const gh=a.h.n>=COACH_SAMP?tot.h.avg-a.h.avg:null,gd=a.d.n>=COACH_SAMP?tot.d.avg-a.d.avg:null;
    const ns=(c.only==="h"?a.h.n:a.h.n+a.d.n);
    const avg=c.only==="h"?a.h.avg:(a.h.n+a.d.n?(a.h.avg*a.h.n+a.d.avg*a.d.n)/(a.h.n+a.d.n):0);
    const pn=c.only==="h"?pa.h.n:pa.h.n+pa.d.n;
    const pavg=pn?(c.only==="h"?pa.h.avg:(pa.h.avg*pa.h.n+pa.d.avg*pa.d.n)/pn):0;
    const delta=pn>=COACH_SAMP&&ns>=COACH_SAMP?avg-pavg:null;
    let gap=null,scope=null;
    if(both){gap=(gh+gd)/2;scope=(gh>=3&&gd>=3)?"both":(gh<=-3&&gd<=-3)?"both":"mixed"}
    else if(c.only==="h"&&gh!=null){gap=gh;scope="h"}
    else if(gh!=null&&gd==null&&a.h.n>=8){gap=gh;scope="h"}
    else if(gd!=null&&gh==null&&a.d.n>=8){gap=gd;scope="d"}
    if(gap==null)return;
    rows.push({id:c.id,l:c.l,a,avg,delta,gap,scope,gh,gd,only:c.only});
  });
  const st=d=>d==null?"base":d>=5?"up":d<=-5?"down":"same";
  rows.forEach(r=>r.status=st(r.delta));
  out.weak=rows.filter(r=>r.gap>=4&&r.avg<75&&r.scope!=="mixed").sort((x,y)=>{const bx=x.scope==="both"?1:0,by=y.scope==="both"?1:0;return by-bx||y.gap-x.gap}).slice(0,3);
  out.strong=rows.filter(r=>r.gap<=-4&&r.avg>=75&&r.scope!=="mixed").sort((x,y)=>{const bx=x.scope==="both"?1:0,by=y.scope==="both"?1:0;return by-bx||x.gap-y.gap}).slice(0,2);
  return out;
}

// ================= 핸드 퀴즈 상세 해설: 실제 계산 + 교재 차트 =================
const DSUITS=["♠","♥","♦","♣"];
const DECK52=[];for(const r of "23456789TJQKA")for(const s of DSUITS)DECK52.push(r+s);
function clsIdx(cards){const a=cards[0],b=cards[1];const ia=DRK.indexOf(a[0]),ib=DRK.indexOf(b[0]);const hi=Math.min(ia,ib),lo=Math.max(ia,ib);
  if(hi===lo)return hi*13+hi;const suited=a.slice(1)===b.slice(1);return suited?hi*13+lo:lo*13+hi}
// hero share of the pot vs the given villain hands (ties split), exact enumeration after the flop, sampled preflop
function equityVs(hero,vills,board){
  const used=new Set([...hero,...vills.flat(),...board]);const rest=DECK52.filter(c=>!used.has(c));const need=5-board.length;
  let tot=0,share=0;
  const score=run=>{const b=board.concat(run);const hr=best7(hero.concat(b));let best=hr,win=1,ties=1;
    for(const v of vills){const r=best7(v.concat(b));const c=cmp(r,best);if(c>0){best=r;win=0;ties=1}else if(c===0){ties++}}
    if(cmp(hr,best)===0)share+=1/ties;tot++};
  if(need===0)score([]);
  else if(need===1)rest.forEach(c=>score([c]));
  else if(need===2){for(let i=0;i<rest.length;i++)for(let j=i+1;j<rest.length;j++)score([rest[i],rest[j]])}
  else{for(let t=0;t<2500;t++){const d=rest.slice();const run=[];for(let k=0;k<need;k++){const x=k+Math.floor(Math.random()*(d.length-k));[d[k],d[x]]=[d[x],d[k]];run.push(d[k])}score(run)}}
  return share/tot;
}
const RV=c=>"23456789TJQKA".indexOf(c[0]);
function strengthText(hero,board){
  if(board.length<3)return null;
  const best=best7like(hero.concat(board));
  const cat=best[0];let name=HN[cat];
  const bv=board.map(RV).sort((x,y)=>y-x),hv=hero.map(RV);
  if(cat===1){const pr=best[1];
    if(hv[0]===hv[1]&&hv[0]===pr)name=pr>bv[0]?"오버페어":pr<bv[bv.length-1]?"언더페어":"포켓페어 (보드 중간)";
    else if(hv.includes(pr)){name=pr===bv[0]?"탑페어":pr===bv[1]?"세컨드 페어":"약한 페어";const k=hv.find(x=>x!==pr);if(pr===bv[0]&&k!==undefined)name+=k>=9?" · 좋은 키커":" · 약한 키커"}
    else name="보드 페어 (히어로 카드는 하이카드)";}
  else if(cat===2&&!hv.some(x=>best.slice(1,3).includes(x)))name="보드 투페어 (히어로는 키커만)";
  return name;
}
// cards that lift the hero to a straight or better (or pair-up/trips to two pair+) on the next card, from the hero's view
function outsInfo(hero,board){
  if(board.length<3||board.length>4)return null;
  const used=new Set([...hero,...board]);const rest=DECK52.filter(c=>!used.has(c));
  const now=best7like(hero.concat(board));let outs=0,flush=false,straight=false,full=false;
  for(const c of rest){const r=best7like(hero.concat(board,[c]));if(r[0]>now[0]&&r[0]>=4){
      // count only improvements that use a hero card
      const bo=board.length+1>=5?best7like(board.concat([c])):null;if(!bo||cmp(r,bo)>0){outs++;if(r[0]===5)flush=true;if(r[0]===4)straight=true;if(r[0]>=6)full=true}}}
  const unseen=rest.length;
  const p1=outs/unseen;const p2=board.length===3?1-((unseen-outs)*(unseen-outs-1))/(unseen*(unseen-1)):p1;
  const kinds=[flush?"플러시":"",straight?"스트레이트":"",full?"풀하우스 이상":""].filter(Boolean).join("·");
  return{outs,p1,p2,kinds};
}
function best7like(cs){if(cs.length===5)return rank5(cs);let b=null;const n=cs.length;
  for(let i=0;i<n;i++)for(let j=(n===6?i:i+1);j<n;j++){const five=cs.filter((_,k)=>n===6?k!==i:(k!==i&&k!==j));if(five.length!==5)continue;const r=rank5(five);if(!b||cmp(r,b)>0)b=r}
  return b}
// preflop chart reference for this hand's first decision
const QPOS=p=>p==="MP"?"UTG+2":p;
function chartRef(h){
  const D=h.d||100,me=QPOS(h.me),pf=h.pf;const unopened=pf[1]<=1;
  const stacks=[15,25,40,75];
  const near=stacks.reduce((a,b)=>Math.abs(b-D)<Math.abs(a-D)?b:a,stacks[0]);
  if(unopened&&me!=="BB"){
    if(D===10)return{sp:{kind:"pf10",st:10,pos:me,spot:"rfi"},exact:true};
    const st=stacks.includes(D)?D:near;const c=DRILL_CHARTS.find(x=>x.st===st&&x.pos===me&&x.spot==="rfi");
    return c?{sp:{kind:"chart",...c},exact:st===D,from:st}:null;
  }
  if(me==="BB"&&QPOS(h.vs)==="BTN"&&!h.multi&&pf[1]<=3&&D>=25){const c=DRILL_CHARTS.find(x=>x.spot==="vs_open");return{sp:{kind:"chart",...c},exact:D===40,from:40}}
  if(!h.multi&&/올인/.test(h.s[0].a)&&D<=15&&DPOS.indexOf(QPOS(h.vs))<DPOS.indexOf(me)){const k=QPOS(h.vs)+">"+me;if(DRILL_PF10.call[k])return{sp:{kind:"pf10",st:10,pos:me,op:QPOS(h.vs),spot:"vs_shove"},exact:D===10,from:10}}
  return null;
}

const B1=13,B2=169,B3=2197,B4=28561,B5=371293;
const CI=new Map();DECK52.forEach((c,i)=>CI.set(c,i));const ci=c=>CI.get(c);
const FRC=new Int8Array(13);
function fStr(m){for(let hi=12;hi>=4;hi--){const w=0x1F<<(hi-4);if((m&w)===w)return hi}if((m&0xF)===0xF&&(m&4096))return 3;return -1}
function fev(a){
  FRC.fill(0);let s0=0,s1=0,s2=0,s3=0,m0=0,m1=0,m2=0,m3=0,rm=0;
  for(let i=0;i<a.length;i++){const x=a[i],r=x>>2,s=x&3,bit=1<<r;FRC[r]++;rm|=bit;
    if(s===0){s0++;m0|=bit}else if(s===1){s1++;m1|=bit}else if(s===2){s2++;m2|=bit}else{s3++;m3|=bit}}
  const fm=s0>=5?m0:s1>=5?m1:s2>=5?m2:s3>=5?m3:0;
  if(fm){const st=fStr(fm);if(st>=0)return 8*B5+st*B4;let v=0,k=0;for(let r=12;r>=0&&k<5;r--)if(fm&(1<<r)){v=v*13+r;k++}return 5*B5+v}
  let q=-1,t0=-1,t1=-1,p0=-1,p1=-1,p2=-1;
  for(let r=12;r>=0;r--){const c=FRC[r];if(c===4)q=r;else if(c===3){if(t0<0)t0=r;else if(t1<0)t1=r}else if(c===2){if(p0<0)p0=r;else if(p1<0)p1=r;else if(p2<0)p2=r}}
  const kick=(e1,e2,n)=>{let v=0,k=0;for(let r=12;r>=0&&k<n;r--)if(FRC[r]&&r!==e1&&r!==e2){v=v*13+r;k++}return v};
  if(q>=0)return 7*B5+q*B4+kick(q,-1,1)*B3;
  if(t0>=0&&(t1>=0||p0>=0))return 6*B5+t0*B4+Math.max(t1,p0)*B3;

// players who may not write the shared store (outside guests) send their record as presence; the owner's open page writes it for them
function lbPresence(){
  if(!LB.room||LB.owner||!MYNAME||LB.season===null)return;
  LB.room.presence({app:"hgq",acc:accMine(),name:MYNAME,season:LB.season,kick:+(lsGet("hgq-kick")||0),hands:STATS.n,sum:STATS.sum,best:STATS.best,dn:DSTATS.n,dsum:DSTATS.sum,dbest:DSTATS.best}).catch(()=>{});
}
function lbClean(pr){
  const I=(v,max)=>{v=Math.floor(+v);return Number.isFinite(v)&&v>=0?Math.min(v,max):0};
  if(!pr||pr.app!=="hgq"||typeof pr.name!=="string")return null;
  const name=pr.name.replace(/[\u0000-\u001f\u007f]/g,"").replace(/\s+/g," ").trim().slice(0,12);if(!name)return null;
  const hands=I(pr.hands,100000),dn=I(pr.dn,100000);
  const sum=Math.min(I(pr.sum,1e7),hands*100),dsum=Math.min(I(pr.dsum,1e7),dn*100);
  return{name,season:I(pr.season,1e9),hands,sum,avg:hands?Math.round(sum/hands*10)/10:0,best:Math.min(I(pr.best,1e5),hands),dn,dsum,davg:dn?Math.round(dsum/dn*10)/10:0,dbest:Math.min(I(pr.dbest,1e5),dn)};
}
function lbRelay(peer){
  if(!LB.owner||!LB.db||!peer||peer.kind!=="viewer"||peer.isMe||!peer.by)return;
  if(!accOk(peer.presence)||isBlocked(peer.by))return;
  const r=lbClean(peer.presence);if(!r||r.season!==LB.season)return;
  if((+LB.kicks[peer.by]||0)>(+(peer.presence||{}).kick||0))return;
  if(!LB.rowsReady)return;
  const cur=LB.rows.find(x=>x.id===peer.by);
  const row={...r};
  // a player on a fresh device reports a smaller record until it loads the saved one: keep the bigger side per mode
  if(cur&&cur.season===r.season&&(+cur.at||0)>(+LB.kicks[peer.by]||0)){
    if((+cur.hands||0)>row.hands){row.hands=+cur.hands;row.sum=+cur.sum||0;row.avg=+cur.avg||0;row.best=+cur.best||0}
    if((+cur.dn||0)>row.dn){row.dn=+cur.dn;row.dsum=+cur.dsum||0;row.davg=+cur.davg||0;row.dbest=+cur.dbest||0}
  }
  if(cur&&cur.season===row.season&&cur.hands===row.hands&&cur.dn===row.dn&&cur.name===row.name)return;
  LB.relayQ.set(peer.by,{...row,via:"relay",guest:!!peer.guest,at:Date.now()});lbRelayRun();
}
async function lbRelayRun(){
  if(LB.relaying)return;LB.relaying=true;
  try{while(LB.relayQ.size){const [id,row]=LB.relayQ.entries().next().value;LB.relayQ.delete(id);
    try{await LB.db.doc("scores/"+id).set(row)}catch(e){}}}finally{LB.relaying=false}
}
// the shared record is the source of truth: a fresh browser, another device, or a new page version starts with empty local
// storage, so take over the saved record (per mode, whichever has more rounds) instead of overwriting it with zeros
function lbAdopt(){
  if(!LB.uid||LB.season===null)return;
  const r=LB.rows.find(x=>x.id===LB.uid);if(!r||r.season!==LB.season)return;
  if((+r.at||0)<=(+LB.kicks[LB.uid]||0))return;
  let ch=false;
  if((+r.hands||0)>STATS.n){STATS={n:+r.hands,sum:+r.sum||Math.round((+r.avg||0)*(+r.hands)),streak:0,best:+r.best||0};saveStats(STATS);ch=true}
  if((+r.dn||0)>DSTATS.n){DSTATS={n:+r.dn,sum:+r.dsum||Math.round((+r.davg||0)*(+r.dn)),streak:0,best:+r.dbest||0};dSave();ch=true}
  if(ch){lsSet("hgq-season",String(LB.season));lbPresence();if(SCREEN==="menu")menu()}
}
// write this viewer's row from the local record; one write at a time, the latest state wins
async function lbPush(){
  lbPresence();
  if(!LB.db||!LB.uid||!MYNAME||LB.writeFail||LB.canWrite===false||LB.season===null)return;
  if(!LB.rowsReady){LB.pendPush=true;return}
  lbAdopt();
  if(LB.pushing){LB.again=true;return}
  LB.pushing=true;
  try{do{LB.again=false;
    await LB.db.doc("scores/"+LB.uid).set({name:MYNAME,season:LB.season,hands:STATS.n,sum:STATS.sum,avg:STATS.n?Math.round(STATS.sum/STATS.n*10)/10:0,best:STATS.best,
      dn:DSTATS.n,dsum:DSTATS.sum,davg:DSTATS.n?Math.round(DSTATS.sum/DSTATS.n*10)/10:0,dbest:DSTATS.best,at:Date.now()});
  }while(LB.again)}catch(e){if(e&&e.code==="invalid_argument"){LB.writeFail=true;if(window.HGQ_WEB&&!LB.owner){lsSet("hgq-acc","");ACC.sig=null;gateCheck()}if(SCREEN==="menu")lbRender()}}
  LB.pushing=false;
}
// one record → the numbers a tab ranks by; "all" pools every scored round from both modes
// overall score/grade only once both modes have ALL_MIN rounds each
const ALL_MIN=5;
function allReady(hn,dn){return hn>=ALL_MIN&&dn>=ALL_MIN}
function lbPick(r,tab){
  const hn=+r.hands||0,dn=+r.dn||0;
  if(tab==="hand")return{n:hn,avg:+r.avg||0,best:+r.best||0};
  if(tab==="drill")return{n:dn,avg:+r.davg||0,best:+r.dbest||0};
  const hs=r.sum!=null?+r.sum||0:(+r.avg||0)*hn,ds=r.dsum!=null?+r.dsum||0:(+r.davg||0)*dn,n=hn+dn;
  return{n,hn,dn,avg:n?Math.round((hs+ds)/n*10)/10:0,best:Math.max(+r.best||0,+r.dbest||0)};
}
function lbRowsFor(tab){
  const k={u:tab==="hand"?"핸드":tab==="drill"?"문제":"판"};
  const by=new Map();
  LB.rows.filter(r=>r.season===LB.season&&typeof r.name==="string"&&r.name.trim()&&!isBlocked(r.id)).forEach(r=>by.set(r.id,{id:r.id,name:r.name.slice(0,12),...lbPick(r,tab),live:false}));
  LB.peers.forEach(p=>{if(!p.by||!accOk(p.presence)||isBlocked(p.by))return;const c=lbClean(p.presence);const cur=by.get(p.by);
    if(!c||c.season!==LB.season||(+LB.kicks[p.by]||0)>(+(p.presence||{}).kick||0)){if(cur)cur.live=true;return}
    const v={id:p.by,name:c.name,...lbPick(c,tab),live:true};
    if(!cur||v.n>=cur.n)by.set(p.by,v);else cur.live=true});
  const rows=[...by.values()].filter(r=>r.n>0);
  const MIN=5,ok=r=>tab==="all"?allReady(r.hn,r.dn):r.n>=MIN;
  const ranked=rows.filter(ok).sort((a,b)=>b.avg-a.avg||b.n-a.n),wait=rows.filter(r=>!ok(r)).sort((a,b)=>b.n-a.n);
  return{ranked,wait,u:k.u,MIN};
}

  if(!LB.db)return `<div class="lb"><div class="lbh"><b>순위</b></div><p class="note" style="text-align:left">서버에 연결되면 함께 푸는 사람들의 순위가 여기에 보여요.</p></div>`;
  let {ranked,wait,u,MIN}=lbRowsFor(LB.tab);
  const ro=!LB.uid||LB.writeFail||LB.canWrite===false;
  if(ro){const loc=LB.tab==="hand"?{n:STATS.n,sum:STATS.sum,best:STATS.best}:LB.tab==="drill"?{n:DSTATS.n,sum:DSTATS.sum,best:DSTATS.best}:{n:STATS.n+DSTATS.n,hn:STATS.n,dn:DSTATS.n,sum:STATS.sum+DSTATS.sum,best:Math.max(STATS.best,DSTATS.best)};
    if(loc.n>0){const r={id:"__local",name:MYNAME||"나",n:loc.n,hn:loc.hn,dn:loc.dn,avg:Math.round(loc.sum/loc.n*10)/10,best:loc.best,local:true};
      if(LB.tab==="all"?allReady(r.hn,r.dn):r.n>=MIN){wait=wait.filter(x=>x.id!==LB.uid);ranked=ranked.filter(x=>x.id!==LB.uid).concat([r]).sort((a,b)=>b.avg-a.avg||b.n-a.n)}else{ranked=ranked.filter(x=>x.id!==LB.uid);wait=wait.filter(x=>x.id!==LB.uid).concat([r])}}}
  const isMe=r=>r.local||(LB.uid&&r.id===LB.uid);
  const row=(r,i)=>`<li class="${isMe(r)?"me":""}"><span class="rk">${i===null?"-":i+1}</span><span class="nm">${r.live?`<i class="dot" title="접속 중"></i>`:""}${esc(r.name)}${isMe(r)?`<em>${r.local&&!LB.room?"나 · 이 기기만":"나"}</em>`:""}</span><span class="sc2"><span class="sct">${tierTag(r.avg,r.n)}<b>${Math.round(r.avg)}</b></span><small>${r.n}${u} · 연속 ${r.best}</small></span></li>`;
  let body=ranked.length?`<ol class="lbl">${ranked.map((r,i)=>row(r,i)).join("")}</ol>`:`<p class="note" style="text-align:left">아직 순위에 오른 사람이 없어요. ${LB.tab==="all"?`핸드 퀴즈와 오픈 연습을 각각 ${ALL_MIN}판 이상 풀면`:`${MIN}${u} 이상 풀면`} 순위에 올라요.</p>`;
  // players still being measured stay hidden from everyone else; only the admin page lists them, and a player sees only their own progress
  const wv=inAdmin?wait:wait.filter(isMe);
  if(wv.length)body+=LB.tab==="all"?`<p class="lbw">${inAdmin?"종합 측정 중":"내 종합 측정 중"} (핸드·연습 각 ${ALL_MIN}판 필요): ${wv.map(r=>`${esc(r.name)} 핸드 ${Math.min(r.hn||0,ALL_MIN)}/${ALL_MIN} · 연습 ${Math.min(r.dn||0,ALL_MIN)}/${ALL_MIN}`).join(" · ")}</p>`
    :`<p class="lbw">${inAdmin?"기록 쌓는 중":"내 기록 쌓는 중"} (${MIN}${u} 미만): ${wv.map(r=>`${esc(r.name)} ${r.n}${u}`).join(" · ")}</p>`;
  const relayOnly=!LB.owner&&ro;
  const warn=relayOnly?`<p class="lbw">${LB.room?"내 점수는 지금 접속한 모두에게 실시간으로 보이고, 관리자가 접속해 있을 때 순위에 저장돼요.":"지금 접속 방식으로는 내 점수를 모두의 순위에 올릴 수 없어요. 관리자에게 이메일 초대를 요청해 주세요."}</p>`:"";
  const admin=LB.owner&&!inAdmin?`<button class="ghost adb" id="adGo">관리자 페이지</button>`:"";
  return `<div class="lb" id="lbbox"><div class="lbh"><b>순위</b><div class="tabs2"><button data-t="all" class="${LB.tab==="all"?"on":""}">종합</button><button data-t="hand" class="${LB.tab==="hand"?"on":""}">핸드 퀴즈</button><button data-t="drill" class="${LB.tab==="drill"?"on":""}">오픈 연습</button></div></div>
   <p class="lbs">${LB.room||window.HGQ_WEB?`<span class="livetag"><i class="dot"></i>실시간</span> `:""}${LB.tab==="all"?`핸드·연습 합산 평균 순 · 각각 ${ALL_MIN}판 이상부터 순위`:`평균 점수 순 · ${MIN}${u} 이상부터 순위`}${LB.peers.length?` · 지금 ${LB.peers.length+1}명 접속`:""}</p>${body}${warn}${tierGuideHTML()}${LB.msg&&!inAdmin?`<p class="note">${esc(LB.msg)}</p>`:""}${admin}</div>`;

function lbMyRank(tab){
  if(!LB.db||!MYNAME)return"";
  let {ranked,MIN,u}=lbRowsFor(tab);const loc=tab==="hand"?STATS:DSTATS;
  ranked=ranked.filter(r=>r.id!==LB.uid);
  if(loc.n<MIN)return `<div class="myrank"><span class="livetag"><i class="dot"></i>실시간 순위</span><span>${MIN-loc.n}${u} 더 풀면 순위에 올라요 · 현재 ${ranked.length}명</span></div>`;
  const avg=loc.sum/loc.n,pos=ranked.filter(r=>r.avg>avg||(r.avg===avg&&r.n>loc.n)).length+1;
  return `<div class="myrank"><span class="livetag"><i class="dot"></i>실시간 순위</span><span><b>${pos}위</b> / ${ranked.length+1}명</span></div>`;
}

async function lbReset(){
  if(!LB.owner||!LB.db||LB.busy)return;
  LB.busy=true;adminRender();
  try{const snap=await LB.db.collection("scores").get();
    for(const d of snap.docs)await LB.db.doc("scores/"+d.id).delete();

    const bars=d.o.slice().sort((a,b)=>(+d.f[b[0]]||0)-(+d.f[a[0]]||0)).map(([k,l])=>{const v=+d.f[k]||0,me=k===d.k,pt=strictPts(d.f,k),ok=pt===100;
      return `<div class="fq ${ok?"ok":""} ${me?"me":""} ${pt===0?"zero":""}"><div class="fq1"><span class="fql">${l}</span>${ok?`<em class="fqc ok">정답</em>`:""}${me?`<em class="fqc me">${d.to?"시간 초과":"내 선택"}</em>`:""}</div>
        <div class="fqt"><i style="width:${Math.max(v,1.5)}%"></i></div><div class="fqr"><span class="fqv">${v}%</span><span class="fqp">${pt}점</span></div></div>`}).join("");
    const bd=boardUpTo(h,d.si);
    const col=sc[i]>=90?"good":sc[i]>=60?"warn":"bad";
    return `<details class="row" ${i===G.dec.length-1||sc[i]<90?"open":""}><summary><span class="sn">${d.label}</span><span class="sm2">내 선택 <b class="cb">${lab(d.o,d.k)}</b> · 정답 <b class="cg">${lab(d.o,bk)}</b></span><span class="n ${col}">${sc[i]}</span></summary>
      <div class="rbody">${bd.length?`<div class="rb">${bd.map(c=>bigCard(c,"xs")).join("")}</div>`:""}<div class="sa">${hl(d.a)}</div><div class="bars">${bars}</div><div class="core"><span class="ck">핵심</span><p class="cn">${d.n}</p><div class="cs"><p class="rxload">${d.si===0?"차트와 레인지 승률 계산 중…":"레인지 분석 계산 중…"}</p></div></div>
      <details class="more"><summary>자세한 설명 보기</summary><div class="mbody">${detailBlock(h,d)}<div class="rxslot" data-i="${i}"></div></div></details></div></details>`}).join("");
  const good=G.dec.map((d,i)=>sc[i]>=90?d.label:null).filter(Boolean);
  const weak=G.dec.map((d,i)=>sc[i]<90?`${d.label}에서 ${lab(d.o,d.k)}보다 ${ga(lab(d.o,bestOf(d.o,d.f)))} 더 자주 쓰여요.`:null).filter(Boolean);
  const isLast=hi===order.length-1;
  $("panel").innerHTML=`
   <div class="scr"><div><span class="muted">이 핸드 종합 점수</span><div class="big">${tot}<span> / 100</span></div></div><span class="grade ${gradeCls(tot)}">${gradeTxt(tot)}</span></div>
   <p class="dlv"><span class="dlt d${hDiff(h).t}">난이도 ${DIFF_NAME[hDiff(h).t]}</span>${h.multi?"멀티웨이 · ":""}결정 ${h.s.length}번 중 섞어 쓰는 결정 ${h.s.filter(st=>hDecT(st.f)===3).length}번</p>
   <div class="rows">${rows}</div>
   <div class="cx key"><span class="k">이 핸드의 핵심</span><div>${h.key}</div></div>
   <div class="cx ok"><span class="k">잘한 점</span><div>${good.length?`${good.join(", ")} 판단이 GTO와 같아요.`:"이번 핸드는 GTO와 다른 선택이 많았어요."}</div></div>
   ${weak.length?`<div class="cx ng"><span class="k">아쉬운 점</span>${weak.map(w=>`<div>${w}</div>`).join("")}</div>`:""}
   <div class="statrow"><span>누적 <b>${STATS.n}</b>핸드 · 평균 <b>${avgOf()}</b> ${tierTag(STATS.sum/STATS.n,STATS.n)}</span><span>연속 90점+ <b>${STATS.streak}</b></span></div>
   <div id="myrank" data-tab="hand">${lbMyRank("hand")}</div>
   <button class="cta" id="next">다음 핸드</button>`;
  $("next").onclick=()=>{hi++;if(hi>=order.length)deal();newHand();window.scrollTo({top:0})};
  rgAttach(h,G.dec.slice());
  window.scrollTo({top:0});
}

function final(){
  const avg=Math.round(results.reduce((a,b)=>a+b,0)/results.length);
  const prev=getBest(lv);setBest(lv,avg);
  const L=LEVELS[lv];
  $("top").innerHTML=topHTML(`세션 종료`,`${order.length}핸드 평균 점수`,"");
  bindBack();
  $("prog").innerHTML="";
  $("stage").innerHTML=`<div class="band"><div class="bfelt"><span class="muted">${order.length}핸드 평균</span><span class="avg">${avg}</span><span class="muted">${prev===undefined||avg>prev?"새 최고 기록":`최고 기록 ${prev}`}</span></div></div>`;
  const nextLv=false;
  $("panel").innerHTML=`<div class="mini">${order.map((h,i)=>`<div><span>${h.me} vs ${h.vs}${h.vs2?"·"+h.vs2:""} · ${h.hand.map(c=>c.replace("T","10")).join(" ")} · ${h.d||100}BB</span><span class="n">${results[i]}</span></div>`).join("")}</div>
   <span class="grade ${gradeCls(avg)}" style="align-self:center">${gradeTxt(avg)}</span>
   ${nextLv?`<button class="cta" id="up">다음 난이도 ${LEVELS[lv+1].name} 도전</button>`:""}
   <button class="${nextLv?"ghost":"cta"}" id="again">다시 하기</button>
   <button class="ghost" id="menu">처음 화면으로</button>`;
  if(nextLv)$("up").onclick=()=>start(lv+1);
  $("again").onclick=()=>start(lv);
  $("menu").onclick=()=>{menu();window.scrollTo({top:0})};
}
menu();
lbInit();
</script>

  if(j.v&&j.v!==window.APP_VERSION)document.getElementById("upd").hidden=false}catch(e){}};
